name: YouTube Connections (AI - Learning)

on:
  workflow_run:
    workflows: ["YouTube Extracts (AI - Learning)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      k:
        description: "Neighbors per node"
        type: string
        default: "6"
      floor:
        description: "Cosine floor (blank = none)"
        type: string
        default: ""
      dry_run:
        description: "Embed + log distribution only (no writes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: youtube-connections
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Resolve inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "CONN_K=${{ github.event.inputs.k }}" >> "$GITHUB_ENV"
            [ -n "${{ github.event.inputs.floor }}" ] && echo "CONN_FLOOR=${{ github.event.inputs.floor }}" >> "$GITHUB_ENV"
            [ "${{ github.event.inputs.dry_run }}" = "true" ] && echo "CONN_DRY_RUN=1" >> "$GITHUB_ENV"
          fi
          true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          python scripts/youtube-connections/pipeline.py
          echo "PIPELINE_RC=$?" >> "$GITHUB_ENV"

      - name: Commit connections
        run: |
          git add extracts/youtube/ai-learning
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "data(youtube): update ai-learning connections ($(TZ=America/Sao_Paulo date +%F))"
          git push

      - name: Fail if pipeline went red
        run: |
          if [ "${PIPELINE_RC}" != "0" ]; then
            echo "pipeline exited red (rc=${PIPELINE_RC})"
            exit 1
          fi
