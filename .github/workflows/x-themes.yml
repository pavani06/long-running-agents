name: X Themes (bookmarks)

on:
  workflow_dispatch:
    inputs:
      resolution:
        description: "Greedy-modularity resolution"
        type: string
        default: "1.0"
      dry_run:
        description: "Log community count/sizes only (no writes)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: x-themes
  cancel-in-progress: false

jobs:
  themes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade requests networkx

      - name: Resolve inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "THEME_RESOLUTION=${{ github.event.inputs.resolution }}" >> "$GITHUB_ENV"
            [ "${{ github.event.inputs.dry_run }}" = "true" ] && echo "THEME_DRY_RUN=1" >> "$GITHUB_ENV"
          fi
          true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run pipeline
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          set +e
          python scripts/x-themes/pipeline.py
          echo "PIPELINE_RC=$?" >> "$GITHUB_ENV"

      - name: Commit themes
        run: |
          git add extracts/x/bookmarks
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "data(x): update bookmark themes ($(TZ=America/Sao_Paulo date +%F))"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt ${attempt} rejected; rebased, retrying"
            sleep 5
          done
          echo "push failed after retries"
          exit 1

      - name: Fail if pipeline went red
        run: |
          if [ "${PIPELINE_RC}" != "0" ]; then
            echo "pipeline exited red (rc=${PIPELINE_RC})"
            exit 1
          fi

      - name: Chain to next stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "X Digest (bookmarks)" --ref main
