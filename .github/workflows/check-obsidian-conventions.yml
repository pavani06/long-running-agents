name: Check Obsidian Conventions

on:
  push:
    paths:
      - '**.md'
      - '**.canvas'
      - 'scripts/validate-obsidian.ts'
      - 'package.json'
      - 'scripts/analyze-and-improve/spine.py'
      - 'tests/unit/phase4_flow_test.py'
      - '.github/workflows/check-obsidian-conventions.yml'
      # Auto-generated extracts live outside the validator's scope.
      - '!extracts/**'
  pull_request:
    paths:
      - '**.md'
      - '**.canvas'
      - 'scripts/validate-obsidian.ts'
      - 'package.json'
      - 'scripts/analyze-and-improve/spine.py'
      - 'tests/unit/phase4_flow_test.py'
      - '.github/workflows/check-obsidian-conventions.yml'
      - '!extracts/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run Obsidian convention checks
        run: npm run validate:obsidian

  # The Fase-4 destination gate (#263) shells out to validate-obsidian.ts, so its
  # real-validator tests need Node + npm — which only this workflow provides. The
  # pytest PR gate keeps running them as skips; here they MUST execute.
  destination-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade pytest==9.1.0 pyyaml
      - name: Run the destination-gate validator integration tests
        run: |
          python3 -m pytest tests/unit/phase4_flow_test.py -m validator_integration \
            -q --junitxml=validator-integration.xml
      - name: Require those tests to have actually executed
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse("validator-integration.xml").getroot().iter("testsuite"))
          total = sum(int(s.get("tests", "0")) for s in suites)
          skipped = sum(int(s.get("skipped", "0")) for s in suites)
          if total == 0 or skipped:
              raise SystemExit(
                  f"validator_integration tests did not run: {total} collected, {skipped} skipped")
          print(f"{total - skipped} validator_integration test(s) executed")
          PY
