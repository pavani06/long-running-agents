name: YouTube Extracts (AI - Learning)

on:
  workflow_run:
    workflows: ["YouTube Transcripts (AI - Learning)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        type: choice
        default: incremental
        options: [incremental, full, rebuild]
      cap:
        description: "Per-run extract cap (blank = default)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: youtube-extracts
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    # For the chained trigger, only run when the transcripts workflow succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Resolve mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> "$GITHUB_ENV"
            if [ -n "${{ github.event.inputs.cap }}" ]; then
              echo "EXTRACT_CAP=${{ github.event.inputs.cap }}" >> "$GITHUB_ENV"
            fi
          else
            echo "MODE=incremental" >> "$GITHUB_ENV"
          fi

      - name: Run pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          set +e
          python scripts/youtube-extracts/pipeline.py "$MODE"
          echo "PIPELINE_RC=$?" >> "$GITHUB_ENV"

      - name: Commit new extracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracts/youtube/ai-learning
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          added=$(git diff --cached --name-only --diff-filter=A -- 'extracts/youtube/ai-learning/*.md' | wc -l | tr -d ' ')
          git commit -m "data(youtube): add ai-learning extracts ($(TZ=America/Sao_Paulo date +%F)) [+${added}]"
          git push

      - name: Fail if pipeline went red
        run: |
          if [ "${PIPELINE_RC}" != "0" ]; then
            echo "pipeline exited red (rc=${PIPELINE_RC})"
            exit 1
          fi
