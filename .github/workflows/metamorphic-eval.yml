name: Metamorphic Eval (Tier B gate · #288)

# The metamorphic eval-harness PoC (#288): the durable, re-pointable Tier-B
# progression gate that replaces the retired historical A/B criterion (#262).
# Runs the 50 curated cases (Concept Canon + T1–T4 + 2-stage reranker) live:
# stage-1 embedding retrieval + stage-2 OpenAI reranker (≠ GLM) for identity,
# and the GLM Fase-3 classifier + grep-verify for the verdict/evidence anchor.
# Read-only — writes nothing to the repo. This is NOT the daily pipeline.
#
# Cost: each run is billed (index build + ~50 GLM classify calls + reranker).
# Use `max_variants` for a cheap smoke of the first N cases before the full 50.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "gate = the 50-case PoC; diagnose = Gate-B dispersion (retrieval vs classifier)"
        type: choice
        options: ["gate", "diagnose"]
        default: "gate"
      max_variants:
        description: "gate mode: run only the first N of the 50 cases (0 = all). Cheap smoke."
        type: string
        default: "0"
      rerank_k:
        description: "gate mode: stage-1 candidates handed to the stage-2 reranker per variant"
        type: string
        default: "2"
      concepts:
        description: "diagnose mode: comma-separated concept_ids to test (empty = all)"
        type: string
        default: ""
      index_scope:
        description: "docs = prod default (.md only); docs+code = also index scripts/analyze-and-improve/*.py (#288 diagnostic)"
        type: choice
        options: ["docs", "docs+code"]
        default: "docs"

permissions:
  contents: read

concurrency:
  group: metamorphic-eval
  cancel-in-progress: false

jobs:
  metamorphic-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade requests pyyaml

      - name: Build repo semantic index (full)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INDEX_SCOPE: ${{ github.event.inputs.index_scope }}
        run: |
          if [ "$INDEX_SCOPE" = "docs+code" ]; then
            export INDEX_TARGETS="docs/canonical/,docs/decisions/,curriculum/,.opencode/skills/,scripts/analyze-and-improve/"
            export INDEX_EXTS=".md,.py"
            echo "index scope: docs+code (also indexing scripts/analyze-and-improve/*.py)"
          else
            echo "index scope: docs (production default, .md only)"
          fi
          python scripts/analyze-and-improve/pipeline.py index --full

      - name: Run metamorphic PoC / diagnostic
        id: poc
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # Inputs go through env (never interpolated into the script body) to
          # avoid the GitHub Actions script-injection anti-pattern.
          MODE: ${{ github.event.inputs.mode }}
          MAX_VARIANTS: ${{ github.event.inputs.max_variants }}
          RERANK_K: ${{ github.event.inputs.rerank_k }}
          DIAGNOSE_CONCEPTS: ${{ github.event.inputs.concepts }}
        run: |
          set +e
          if [ "$MODE" = "diagnose" ]; then
            python scripts/analyze-and-improve/metamorphic_diagnose.py
          else
            python scripts/analyze-and-improve/metamorphic_poc.py
          fi
          rc=$?
          echo "POC_RC=$rc" >> "$GITHUB_OUTPUT"
          echo "exit: $rc (gate: 0 = PROSSEGUIR, 1 = ITERAR/setup; diagnose: 0 = ok)"

      - name: Decision (job status reflects the gate)
        env:
          POC_RC: ${{ steps.poc.outputs.POC_RC }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "diagnose" ]; then
            [ "$POC_RC" = "0" ] && echo "Diagnostic complete. See the job summary." || { echo "Diagnostic setup error (rc=$POC_RC)."; exit 1; }
          elif [ "$POC_RC" = "0" ]; then
            echo "PoC HELD — Tier B may advance. See the job summary for the report."
          else
            echo "PoC did not hold (rc=$POC_RC) — iterate. See the job summary."
            exit 1
          fi
