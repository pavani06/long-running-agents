name: First Useful Governed Loop (#263 slice)

# Proves ONE real end-to-end path of analyze-and-improve, human-gated:
#   source → analyze → Missing → F4 (run_fase4, #264 wiring) → artifacts + manifest on the
#   proposal branch → Fase-5 index integration → gates/CI → PR → REJECT/EDIT/ACCEPT →
#   human merge = promotion.
# NOT the daily pipeline (that is #266): one manual dispatch, one real non-benchmark source,
# exactly one eligible Missing selected, and the #263 creation engine (run_fase4) creates
# canonical+skill+exercise behind the Etapa-3 gates, records the artifacts manifest, and the
# deterministic Fase-5 consumer recomputes the four index surfaces from it — behind a
# fail-closed diff gate (this run's promoted artifacts + manifest + authorized index updates,
# nothing else). creation != promotion — the PR is the quarantine; nothing reaches main
# without a human merge. Index is built docs-only (production default; the #288 docs+code
# flip is NOT enabled here).
#
# Cost: one billed run (docs-only index build + F1/F2/F3 GLM calls + F4 GLM calls
# + reranker + adversarial-evaluator + dedup embeddings, per artifact).

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Extract filename (empty = deterministic first non-benchmark pending)"
        type: string
        default: ""
      pattern_id:
        description: "Explicit Missing pattern to propose (empty = first eligible Missing)"
        type: string
        default: ""

permissions:
  contents: write        # push the proposal branch
  pull-requests: write   # open the human-review PR

concurrency:
  group: first-loop
  cancel-in-progress: false

jobs:
  first-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade requests pyyaml

      # run_fase4's gates shell out to `npx tsx scripts/validate-obsidian.ts`, which
      # needs node_modules (@pavani_org/obsidian-eval, yaml) — without them the
      # destination gate is fail-closed and would hold every artifact. Mirrors
      # check-obsidian-conventions.yml.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install Node dependencies (F4 destination gate)
        # `ci`, never `install`: it never rewrites package-lock.json, so a lockfile
        # normalisation cannot trip the fail-closed diff gate and abort a billed run.
        run: npm ci

      # Persist/restore the derived index across runs (native Actions cache). This is an
      # OPTIMIZATION only, never authoritative repo state: run_id key always misses so a
      # fresh entry is saved each run; the restore-keys prefix restores the most recent
      # prior index. A cache miss (or corrupt state, per load_state) falls back to a full
      # rebuild. Path is the gitignored .runtime index dir; docs-only scope is unchanged.
      - name: Restore analyze-and-improve index cache
        uses: actions/cache@v4
        with:
          path: .runtime/analyze-and-improve
          key: aai-index-docs-${{ github.run_id }}
          restore-keys: |
            aai-index-docs-

      - name: Build/refresh repo semantic index (docs-only; incremental if cache restored)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # No --full: with a restored index (has base_sha) this takes the incremental delta
        # path and re-embeds only changed chunks; with no/corrupt state it full-rebuilds.
        run: python scripts/analyze-and-improve/pipeline.py index

      - name: Run the First Useful Governed Loop (through F4 + gates; no PR yet)
        id: loop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # Inputs via env (never interpolated into the script) — script-injection safe.
          SOURCE: ${{ github.event.inputs.source }}
          PATTERN_ID: ${{ github.event.inputs.pattern_id }}
          PR_BODY_PATH: pr-body.md
        run: python scripts/analyze-and-improve/first_loop.py

      - name: Integrate indexes from this run's manifest (Fase 5, #264)
        id: integrate
        # Deterministic consumer: reads THIS run's manifest by explicit path
        # (docs/analysis/<slug>/<slug>-artifacts.yaml, never a glob) and recomputes the
        # four index surfaces from disk truth — promoted entries only; quarantined
        # entries never mutate indexes. Emits the diff gate's allowed set.
        if: steps.loop.outputs.has_proposal == 'true'
        run: python scripts/analyze-and-improve/pipeline.py integrate "${{ steps.loop.outputs.slug }}"

      - name: Open ONE human-review PR (auto-merge OFF)
        # Skipped on a successful no-op run (no eligible Missing → no proposal); the loop
        # step exits 0 and the job stays green with "analyzed; no proposal needed".
        if: steps.loop.outputs.has_proposal == 'true'
        env:
          # Reuse the existing PAT (as x-bookmarks does) ONLY for delivery: the default
          # GITHUB_TOKEN can push the branch but is blocked by repo policy from creating
          # PRs. Passed via env (never echoed/logged); value never printed.
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          BRANCH: ${{ steps.loop.outputs.branch }}
          PR_TITLE: ${{ steps.loop.outputs.pr_title }}
          SLUG: ${{ steps.loop.outputs.slug }}
          ALLOWED: ${{ steps.integrate.outputs.allowed }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Fail-closed diff gate (#264): the commit may hold ONLY this run's promoted
          # artifacts + this run's manifest + the derived index updates the manifest
          # authorizes. Anything outside holds the run.
          # Two scratch surfaces are excluded rather than gated: pr-body.md (this
          # workflow's own file) and this run's quarantine dir (gate-rejected content —
          # it stays in the worktree, never reaches the PR, and stays human-reviewable
          # through the manifest rendered in the PR body), so an all-held run still
          # opens the manifest-only PR.
          # -uall: list untracked files individually, never collapsed directories.
          QUARANTINE="docs/analysis/$SLUG/proposed/"
          CHANGED=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ "$f" = 'pr-body.md' ] && continue
            case "$f" in "$QUARANTINE"*) continue ;; esac
            if ! printf '%s\n' "$ALLOWED" | grep -qxF -- "$f"; then
              echo "::error::change outside the allowed set: $f"
              exit 1
            fi
            CHANGED="$CHANGED$f"$'\n'
          done < <(git status --porcelain -uall | cut -c4-)
          printf '%s' "$CHANGED" | xargs git add --
          git commit -m "proposal(analyze-and-improve): $PR_TITLE

          Artifacts created by run_fase4 (the #263 engine — single production F4 path,
          #264) on this proposal branch, plus this run's artifacts manifest and the
          derived-index updates the Fase-5 integrator recomputed from it. creation !=
          promotion — the PR is the quarantine; promotion happens ONLY when a human
          merges this PR to main. auto-merge OFF.

          Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          git push -u origin "$BRANCH"
          # auto-merge is NOT enabled — the PR waits for a human.
          gh pr create --base main --head "$BRANCH" --title "$PR_TITLE" --body-file pr-body.md
