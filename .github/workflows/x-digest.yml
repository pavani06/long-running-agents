name: X Digest (bookmarks)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Digest mode"
        type: choice
        options: ["daily", "bootstrap"]
        default: "daily"

permissions:
  contents: write
  actions: write

concurrency:
  group: x-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Resolve mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DIGEST_MODE=${{ github.event.inputs.mode }}" >> "$GITHUB_ENV"
          else
            echo "DIGEST_MODE=daily" >> "$GITHUB_ENV"
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run pipeline
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          set +e
          python scripts/x-digest/pipeline.py "${DIGEST_MODE}"
          echo "PIPELINE_RC=$?" >> "$GITHUB_ENV"

      - name: Commit digest
        run: |
          git add digests/x
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "data(x): update digest (${DIGEST_MODE}, $(TZ=America/Sao_Paulo date +%F))"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt ${attempt} rejected; rebased, retrying"
            sleep 5
          done
          echo "push failed after retries"
          exit 1

      - name: Fail if pipeline went red
        run: |
          if [ "${PIPELINE_RC}" != "0" ]; then
            echo "pipeline exited red (rc=${PIPELINE_RC})"
            exit 1
          fi
