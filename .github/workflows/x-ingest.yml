name: X Ingest (bookmark link content)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental = missing; retry = also failed; full = all"
        type: choice
        default: incremental
        options: [incremental, retry, full]
      cap:
        description: "Per-run cap (blank = default)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: x-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests trafilatura

      - name: Resolve mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> "$GITHUB_ENV"
            if [ -n "${{ github.event.inputs.cap }}" ]; then
              echo "INGEST_CAP=${{ github.event.inputs.cap }}" >> "$GITHUB_ENV"
            fi
          else
            # chained daily: retry re-fetches missing AND previously-failed links,
            # so transient failures (e.g. Jina rate-limit) self-heal next run.
            echo "MODE=retry" >> "$GITHUB_ENV"
          fi

      - name: Run pipeline
        run: |
          set +e
          python scripts/x-ingest/pipeline.py "$MODE"
          echo "PIPELINE_RC=$?" >> "$GITHUB_ENV"

      - name: Commit ingested content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ingest/x
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          added=$(git diff --cached --name-only --diff-filter=A -- 'ingest/x/*.md' | wc -l | tr -d ' ')
          git commit -m "data(x): ingest bookmark link content ($(TZ=America/Sao_Paulo date +%F)) [+${added}]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt ${attempt} rejected; rebased, retrying"
            sleep 5
          done
          echo "push failed after retries"
          exit 1

      - name: Fail if pipeline went red
        run: |
          if [ "${PIPELINE_RC}" != "0" ]; then
            echo "pipeline exited red (rc=${PIPELINE_RC})"
            exit 1
          fi

      - name: Chain to next stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "X Extracts (bookmarks)" --ref main
