meta:
  title: "Mental Model — long-running-agents Repository"
  date: "2026-09-02"
  repo: "long-running-agents"
  type: "mental-model"
  base_commit: "48c5d45"

goals:
  - "Teach harness engineering for long-running AI agent reliability via a 12-week, 4-level curriculum applied to the KODA reference agent"
  - "Reference 176 canonical agentic architecture patterns in docs/canonical/"
  - "Operationalize the analyze-and-improve pipeline: external knowledge -> patterns -> classification -> canonical docs + skills + exercises"
  - "Govern documentation via system-of-record.md precedence (ADR > canonical > evidence > analysis > archive > README) and domain map"
  - "Address three structural failure modes: context loss, fragile planning, blind self-evaluation"
  - "Provide a reusable .opencode/ agent system template (HoP: 3 agents, 36 skills)"

architecture:
  abstractions:
    - name: "Harness"
      description: "Infrastructure and patterns wrapping agents for long-term reliability — the central abstraction"
      source: "curriculum/GLOSSARY.md:411-424"
    - name: "Owned Agent Control Loop"
      description: "4-component decomposition: Prompt, Context Builder, Switch Statement, Loop — with explicit intervention points"
      source: "README.md:73"
    - name: "Generator-Evaluator"
      description: "Two-agent architecture separating generation from evaluation; generator does not self-evaluate"
      source: "README.md:82"
    - name: "Plan-Execute-Verify"
      description: "Three-phase task decomposition with per-phase contracts and checkpoints"
      source: "README.md:83"
    - name: "External State Persistence"
      description: "Decoupling agent memory from model memory: catalog, exact retrieval, pause/resume, writeback"
      source: "README.md:76-78"
    - name: "LLM as Fuzzy Compiler"
      description: "LLM = compiler backend, harness = optimization passes, generated code = disposable build artifact"
      source: "curriculum/GLOSSARY.md:312-326"
    - name: "HoP (Handoff Protocol)"
      description: "Agent system model: closed scope, owner, validation gates — 3 agents, 36 skills"
      source: "docs/system-of-record.md:27"
    - name: "System of Record"
      description: "Six-level documentation precedence and domain map — the conflict-resolution arbiter"
      source: "docs/system-of-record.md:14-21"
    - name: "Obsidian Vault / obsidian-eval"
      description: "Wikilink knowledge management with cross-vault navigation via @pavani_org/obsidian-eval; federation via ADR"
      source: "README.md:159; docs/decisions/2026-09-01-vault-federation-consultable-registry.md"
