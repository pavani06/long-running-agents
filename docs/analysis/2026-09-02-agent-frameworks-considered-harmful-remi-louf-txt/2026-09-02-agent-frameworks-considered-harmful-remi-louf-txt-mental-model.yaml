terminology:
  - term: "Agent"
    definition: "Autonomous AI entity (LLM-based) that takes actions, uses tools, executes task sequences"
    source: "curriculum/GLOSSARY.md:17-19"
  - term: "Agent Loop"
    definition: "Repetitive cycle: receive input -> think -> act -> get result -> repeat"
    source: "curriculum/GLOSSARY.md:41-46"
  - term: "Harness"
    definition: "Infrastructure and patterns wrapping agents for long-term reliability"
    source: "curriculum/GLOSSARY.md:411-424"
  - term: "Harness Engineering"
    definition: "Discipline of building support infrastructure around the model to ensure reliability on long executions"
    source: "README.md:20-21"
  - term: "Context Window"
    definition: "Total tokens a model can process at once — the agent's immediate memory"
    source: "curriculum/GLOSSARY.md:173-181"
  - term: "Context Amnesia"
    definition: "Agent forgetting prior context after exceeding the context window"
    source: "curriculum/GLOSSARY.md:50-58"
  - term: "Context Rot"
    definition: "Gradual loss of coherence as the agent advances through the window"
    source: "curriculum/GLOSSARY.md:164-170"
  - term: "Generator"
    definition: "Agent responsible for creating; pairs with Evaluator"
    source: "curriculum/GLOSSARY.md:361-370"
  - term: "Evaluator"
    definition: "Separate agent evaluating Generator's work against rubrics with impartial judgment"
    source: "curriculum/GLOSSARY.md:248-260"
  - term: "Sprint Contract"
    definition: "Negotiated agreement between Generator and Evaluator on what done means before starting"
    source: "curriculum/GLOSSARY.md:206-214"
  - term: "Evaluation Rubric"
    definition: "Measurable criteria set for evaluating subjective quality"
    source: "curriculum/GLOSSARY.md:264-280"
  - term: "Sycophancy"
    definition: "LLM tendency to please the user, approving bad quality"
    source: "curriculum/GLOSSARY.md:810-820"
  - term: "Fuzzy Compiler"
    definition: "LLM = compiler backend, harness = optimization passes, code = disposable build artifact"
    source: "curriculum/GLOSSARY.md:312-326"
  - term: "KODA"
    definition: "Reference agent: WhatsApp supplement sales with 2+ hour conversations"
    source: "README.md:21"
  - term: "HoP (Handoff Protocol)"
    definition: "Agent system model: each agent has a closed scope, an owner, and validation gates"
    source: "docs/system-of-record.md:27"
  - term: "System of Record"
    definition: "Documentation precedence and conflict resolution: ADR > canonical > evidence > analysis > archive > README"
    source: "docs/system-of-record.md:14-21"
  - term: "ADR"
    definition: "Document recording a significant architecture decision, its context and consequences"
    source: "curriculum/GLOSSARY.md:61-68"
  - term: "Wikilink"
    definition: "[[path/relative/to/repo/root|Display Text]] format for all cross-references"
    source: "AGENTS.md:166-168"
  - term: "Canonical Doc"
    definition: "Authoritative reference pattern document (type: canonical)"
    source: "docs/ecosystem-glossary.md:370-382"

