meta:
  title: "Knowledge Extraction: Kavak's Playbook for Rebuilding a Company Around AI"
  source: 'Raw-Knowledge/sources/2026-08-30-kavak-s-playbook-for-rebuilding-a-company-around-ai.md'
  date: '2026-08-30'
  type: 'analysis'
frameworks:
  - name: "The 2035 design question"
    components:
      - "Anchor question: build the company in 2035 with GPT-10-level intelligence, not incremental improvement"
      - "Answer is structurally different from current company; the gap defines transformation scope"
  - name: "Three-decision framework for becoming agent-run"
    components:
      - "Redesign whole company around agents (rebuild APIs/systems + generate feedback loops)"
      - "Bet on superhuman agents (beat best human ever hired, on hardest problems)"
      - "Change success measurement from transactional to relational (LTV maximization)"
  - name: "Greenfield org-design axiom"
    components:
      - "Design org from scratch assuming abundant cheap superintelligence"
      - "Never retrofit AI onto the legacy org"
  - name: "Evals-as-brakes model"
    components:
      - "Maximum speed is a function of eval quality"
      - "Response to AI risk is building better brakes, not going slower"
  - name: "Economic reframing: tokens as unit of labor"
    components:
      - "More invested in tokens than knowledge workers"
      - "Human role shrinks to physical-presence and leadership interfaces"
  - name: "Relational economics"
    components:
      - "Activating 1% of dormant base via agent-driven relationships worth hundreds of millions"
      - "Justifies agent-per-customer over transactional optimization in high-ticket industries"
  - name: "Token-value tiering (AI cost accounting)"
    components:
      - "Tier 3: production agent tokens, per-token ROI directly measurable"
      - "Tier 2: value measurable indirectly (dev copilot tokens via codebase)"
      - "Tier 1: generic chat/IDE usage, value unknown (where most companies sit)"
  - name: "Carve-out city pilot (AI CEO)"
    components:
      - "One isolated city as contained experiment, agent in standard harness as CEO"
      - "Hard P&L target: 2x profits month one; got 1.5x in six weeks"
      - "Value mechanism: perfect forecasting of every number/customer + daily micromanagement via plans and voice-note telemetry"
  - name: "Self-improving organization (RSI reframe)"
    components:
      - "4000 years of economic value came from organizations, not individuals"
      - "Aim recursive self-improvement at org (harness + evals + agents absorbing each new model) for exponential company value"
  - name: "Schumpeterian creative destruction applied to AI"
    components:
      - "Innovation reaches economy via AI-native companies destroying incumbents"
      - "Deep adoption requires CEO to destroy decades of prior building; refusal is the startup wedge"
  - name: "General-purpose technology adoption curve (electricity analogy)"
    components:
      - "Engine swap in unchanged factory (shafts/belts) → ~6% gain"
      - "Factory rebuild (flat layout, relocation, distributed dynamos) → ~3x productivity"
      - "40-year electricity-to-Ford lag: technology existing ≠ adoption; gap is organizational"
      - "Repeated with computers, repeating with AI; innovator's dilemma at industrial scale"
  - name: "Conservative extrapolation heuristic"
    components:
      - "Plan against linear AI improvement, not exponential"
      - "Linear baseline de-risks forecasts; exponential upside is bonus, not dependency"
patterns:
  - name: "Agent-per-customer, not agent-per-task"
    problem: "Task-scoped agents lose context and own no outcome"
    mechanism: "One persistent agent per customer (millions scale) on its own VM with every company API/skill; humans build skills for agents; 100k-200k instantiated daily"
  - name: "Persistent cross-channel memory + long-term goal"
    problem: "Channel-by-channel service forgets the customer"
    mechanism: "Agent remembers years of interactions (web, calls) and sets long-term strategy to maximize LTV and cross-product conversion"
  - name: "Long-running goal-driven agents, not workflow agents"
    problem: "Scripted workflow agents cap at the workflow designer's imagination"
    mechanism: "Agents hold hard goals and persist toward them; explicit bet against multi-agent expert/workflow pattern"
  - name: "Alarm-clock lifecycle"
    problem: "Scheduling a fleet of hundreds of thousands of agents"
    mechanism: "Agents wake, work 3 minutes to 3 days, set an alarm for next task, sleep"
  - name: "Agent-VM harness (post-Opus-4.5 rebuild)"
    problem: "Orchestration scaffolding tuned to current models caps future models"
    mechanism: "VM + memory + evals + CLI exposing every company tool/API; model-agnostic so monthly smarter models land without rewrites"
  - name: "Mega-expert consolidation"
    problem: "15 specialist teams fragment the customer experience"
    mechanism: "Build an agent that beats each individual expert, then fuse into a single mega expert facing the customer"
  - name: "Shared fleet learning"
    problem: "Per-agent learning wastes mistakes across the fleet"
    mechanism: "One agent's mistake is learned by the entire ~200k fleet by the next day"
  - name: "Closed-loop human-in-the-loop ('I need help' API)"
    problem: "Escalation to tier-2 human queues never closes the loop; no training data generated"
    mechanism: "Stuck agent calls a help API; human answers on the other side; resolution flows back into the agent. Human teams serving an agent outperform the reverse"
  - name: "Sidekick pattern for physical work (Ratatouille / El Mike)"
    problem: "Dexterity and senses irreplaceable in physical inspection work"
    mechanism: "Same scaling harness, agent rides along guiding the mechanic (~800); inspection quality up, warranty costs down ~20-26%, CSAT up"
  - name: "Three-role team topology"
    problem: "Legacy functional org has no place for agentic work"
    mechanism: "Flat, senior, empowered pods mixing engineering + AI + operations; every person builds agents, works for agents, or is physical-world/customer-facing"
  - name: "Human-in-the-loop only at physical boundaries"
    problem: "Where to keep humans without losing agent leverage"
    mechanism: "96% of interactions and 95% of transactions fully agent-handled; humans only where physical presence is required (handing over keys)"
  - name: "Eval-investment parity rule"
    problem: "Evals built as afterthought cap achievable speed"
    mechanism: "Roughly equal engineering time, tokens, and money on evals as on agents themselves"
  - name: "Outcome-level eval hierarchy"
    problem: "Superficial KPIs (call counts, minutes) hide real breakage"
    mechanism: "First-order eval is business results (conversion, willingness to re-engage), then optimize architecture and add skills"
  - name: "Deep personalization under portfolio constraints"
    problem: "Unbounded per-customer optimization endangers the portfolio"
    mechanism: "Rate, risk, and max loan personalized per customer but optimized against risk level, competing offers, and portfolio health"
  - name: "Structure-determines-yield"
    problem: "Same technology, categorically different returns across companies"
    mechanism: "Architecture (physical layout then, process/org design now) is the binding constraint on value capture, not the tool (6% vs 3x)"
  - name: "Distributed-unit design"
    problem: "Centralized AI layer bolted onto the org mirrors the single coal engine"
    mechanism: "Distributed small-scale compute/agents throughout the company, analogue of small dynamos across a flat factory layout"
operational_lessons:
  - lesson: "Agents are taught by exposure"
    context: "Lab-only agents don't converge; only real-customer interaction data plus evals close the training loop"
  - lesson: "Build sales agents, not support agents"
    context: "Highest-leverage task first (selling high-ticket items): tripled NPS/CSAT, 2.1x conversion vs humans (initially 1.5x)"
  - lesson: "Structural advantage of agents in complex sales"
    context: "Infinite patience, complete history, long-horizon planning, no fatigue over 3-4 month purchase cycles"
  - lesson: "Long decision cycles are an asset"
    context: "Knowing the customer through a multi-month decision process drives conversion and retention through the roof"
  - lesson: "Regulated fintech end-to-end is tractable"
    context: "Underwriting thin/no-file customers via agents; loan approval from ~2 months to under 3 minutes"
  - lesson: "Vertical integration as credit-risk mitigant"
    context: "Defaulting customer returns the car and receives a cheaper one; the asset backs the loan"
  - lesson: "Company-wide agent literacy (Jedi Academy)"
    context: "6-week program CEO to mechanics; graduates ship SOTA agents to production; curriculum redesigned in-house, led by leadership"
  - lesson: "AI-CEO value comes from depth, not altitude"
    context: "Enumerate every number and customer, forecast perfectly, micromanage daily execution against plan"
  - lesson: "Retraining as explicit forced choice"
    context: "Tell each function exactly what changes; training or exit; strengthened culture instead of attrition"
  - lesson: "Don't outsource agentic upskilling"
    context: "Curriculum doesn't exist externally; design and iterate internally"
  - lesson: "Transformation must be top-down"
    context: "Hackathons and sponsored use cases don't work; fix the 3-5-year target state and drive vertically (army metaphor)"
  - lesson: "Account for token quality, not volume"
    context: "Attribute spend by tier, push usage up the tier ladder, iterate"
  - lesson: "Realistic reskilling outcome"
    context: "Most graduates won't become AI engineers; requirement is fluency collaborating with agentic systems"
  - lesson: "Superficial adoption measurably caps out"
    context: "Tooling swapped into unchanged processes: 6-10% gains; 10x-class only from redesign around agents"
  - lesson: "Frontier intelligence effectively free ($20/month)"
    context: "Differentiator is depth of adoption and imagination of the rebuilt process, not access"
  - lesson: "Timing lesson from prior venture (Oppy Analytics, 2013)"
    context: "Right vision, missing substrate (pre-transformer ML); current bet sized to technology actually existing"
tradeoffs:
  - decision: "Retrofit vs. rebuild"
    benefit: "Rebuild yields agent-operable APIs/systems and real efficiencies"
    cost: "Rebuilding most APIs and internal systems is a prerequisite, not an option"
  - decision: "Speed vs. safety via evals"
    benefit: "Eval quality unlocks maximum velocity (right brakes)"
    cost: "Eval parity halves effective builder capacity"
  - decision: "Tokens vs. knowledge workers"
    benefit: "Tokens scale as primary labor investment"
    cost: "Human role shrinks to physical-presence and leadership interfaces"
  - decision: "Individual personalization vs. portfolio integrity"
    benefit: "Per-customer rate/risk/loan optimization"
    cost: "Must be bounded by portfolio-level risk and systemic objectives"
  - decision: "Superhuman bar vs. incremental automation"
    benefit: "Better-than-best-human on hard problems builds mega-expert architectures"
    cost: "Rejects easy-problem 'good enough' deflection bots"
  - decision: "Orchestration graph vs. minimal harness"
    benefit: "Model-agnostic VM harness lets each model upgrade compound"
    cost: "Deleted two years of working, profitable multi-agent infrastructure"
  - decision: "Task-scoped vs. customer-scoped agents"
    benefit: "Customer agents persist context and own outcomes (LTV)"
    cost: "Requires per-agent VM, memory, and evals"
  - decision: "Escalation-to-humans vs. humans-serving-agents"
    benefit: "Help-API inversion generates closed-loop training data"
    cost: "Restructures human work around agents"
  - decision: "Incumbent adoption vs. AI-native rebuild"
    benefit: "AI-native startups win the wedge"
    cost: "Deep adoption requires destroying legacy structure; most CEOs refuse"
  - decision: "Superficial adoption vs. deep redesign"
    benefit: "Deep redesign: 3x-10x gain"
    cost: "Near-total organizational rebuild (destroying the factory); superficial preserves structure but bounds gain at ~6-10%"
failure_patterns:
  - pattern: "The ChatGPT bolt-on trap"
    cause: "Keep structure as-is, hand chat tools to the team, expect efficiency"
    mitigation: "Redesign the whole company around agents against the 2035 design target"
  - pattern: "Drop-in substitution"
    cause: "New engine adopted while keeping shafts-and-belts processes"
    mitigation: "Rebuild the factory around the technology (flat layout, distributed dynamos analogue)"
  - pattern: "Unwillingness to redesign"
    cause: "Sunk cost of the old structure (innovator's dilemma at industrial scale)"
    mitigation: "Accept the destruction step; incumbents who refuse are displaced by AI-native rebuilders"
  - pattern: "Superficial KPI measurement"
    cause: "Measuring calls/minutes gives signal without truth; breakage happens at conversion level"
    mitigation: "Outcome-level eval hierarchy anchored to business results"
  - pattern: "Slowing down as risk response"
    cause: "Wrong inversion of the speed/brakes relationship"
    mitigation: "Invest in eval capacity to unlock speed instead of throttling velocity"
  - pattern: "Evals as afterthought"
    cause: "Deferring eval design to post-deployment"
    mitigation: "Eval-investment parity: design evals with the agent, at equal cost"
  - pattern: "Right idea, wrong substrate"
    cause: "Betting ahead of capability curves (2013 pre-transformer ML)"
    mitigation: "Size the bet to the technology actually being available; plan on the conservative linear curve"
  - pattern: "Open-loop escalation"
    cause: "Agent hands off to human queue and the case is forgotten; no improvement data"
    mitigation: "Help-API inversion so resolution flows back into the agent as training data"
  - pattern: "Equating adoption with value"
    cause: "Heavy token spend at tier 1 with zero ROI attribution"
    mitigation: "Token-value tiering; attribute spend by tier and climb the ladder"
  - pattern: "Hackathon/use-case-sponsorship transformation"
    cause: "Diffuse bottom-up effort with no target org design"
    mitigation: "Top-down transformation with fixed 3-5-year target state"
  - pattern: "Harness lock-in"
    cause: "Orchestration graphs tuned to current model capability become the ceiling when a step-change model lands (Opus 4.5)"
    mitigation: "Minimal model-agnostic harness (VM + memory + evals + full API access)"
  - pattern: "Assuming external institutions can teach agentic engineering"
    cause: "Field curvature outruns academia"
    mitigation: "Internal academy, continuously redesigned in-house, led by leadership"
synthesis: >-
  The interview is one theorem restated from many angles: structure determines yield. The harness is simultaneously the depreciating asset (scaffolding tuned to current models caps future ones — hence deleting two years of profitable multi-agent infrastructure after Opus 4.5) and the compounding asset (a model-agnostic VM + memory + evals + full-API harness converts each model upgrade into company value without rewrites, which is the mechanical link between the RSI-organization reframe and the electricity adoption curve: the organization, not the model, must compound). Evals are the currency converting model capability into organizational velocity, appearing as brakes (govern speed), parity rule (allocate capacity), and outcome hierarchy (define truth) — every measurement failure (superficial KPIs, tier-1 'adoption', slowing-down-as-risk-response) is a variant of missing or mis-anchored evals. The inversion pattern — humans serving agents via help APIs, three-role topology, sidekick pattern, humans building skills — reverses the default direction of service because escalation-to-human and agent-as-assistant are the same structural error: both open the loop and lose the learning signal. All learning requires production contact (lab-only agents don't converge; closed-loop escalation generates the data; fleet learning propagates it), so the rebuilt APIs and feedback loops are not groundwork for the agents — they are the agents. The apparent contradiction between the 2035/GPT-10 superhuman bet and the conservative linear extrapolation resolves as two instruments: the future-state design defines scope of rebuild; the linear baseline guarantees the business case survives slower-than-hyped capability growth. The moat is organizational, not technological: frontier intelligence is a $20/month commodity, and what incumbents cannot replicate is a CEO willing to destroy decades of prior building — the incumbents' own sunk cost is the AI-native startup's wedge.
