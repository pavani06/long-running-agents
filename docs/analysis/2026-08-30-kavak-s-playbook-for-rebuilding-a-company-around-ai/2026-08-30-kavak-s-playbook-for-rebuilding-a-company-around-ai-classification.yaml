meta:
  title: 'Classification: Kavak''s Playbook for Rebuilding a Company Around AI'
  date: '2026-08-30'
  type: classification
  source: 2026-08-30-kavak-s-playbook-for-rebuilding-a-company-around-ai-patterns.yaml
  batches:
  - 1
  - 2
  patterns: 14
entries:
- pattern_name: Model-Agnostic Agent-VM Harness
  classification: Partial Coverage
  evidence:
  - file: docs/canonical/neutral-selection-layer.md
    line: 28
    quote: A model-agnostic selection layer that sits between the model and the store, serving context
      through a uniform interface regardless of which model, vendor, or session requests it.
  - file: docs/canonical/neutral-selection-layer.md
    line: 53
    quote: NOT_FOUND across all 85 canonical docs. The repo has philosophical alignment with vendor independence
  - file: docs/canonical/model-switching-architecture-enterprise-eval-gate.md
    line: 24
    quote: However, the concrete infrastructure to execute model switching — an enterprise eval dataset
      that tests model upgrades against domain-specific data, side-by-side comparison infrastructure,
      and a mechanical switching decision framework — does not exist.
  - file: docs/canonical/file-system-materialization.md
    line: 38
    quote: 'Materialize everything into files, git, and grep: Domain logic, agent specifications, configuration,
      knowledge bases — if a coding agent needs to interact with it, make it a file.'
  - file: docs/canonical/invariant-compensation-split.md
    line: 25
    quote: Or they keep compensations that only made sense for an older model, turning the harness into
      bug surface, latency, token cost, complexity, and maintenance burden
  integration_value: High
  justification: Canonical docs cover the model-agnostic philosophy (selection layer spec, eval-gated
    model switching, file-system universal tooling) but the repo itself declares the concrete infrastructure
    NOT_FOUND, and the Kavak packaging — per-agent VM + memory + per-agent evals + goal slot + model-swap
    interface as one compounding harness at fleet scale — exists nowhere as a single pattern. A unifying
    canonical doc would tie the spec-only and infrastructure-missing pieces into the repo's compounding-asset
    thesis.
- pattern_name: Alarm-Clock Agent Lifecycle
  classification: Partial Coverage
  evidence:
  - file: docs/canonical/serializable-pause-resume-state.md
    line: 22
    quote: Long-running tools (async API calls, human approval waits, scheduled tasks) cannot complete
      inside a single synchronous model call.
  - file: docs/canonical/serializable-pause-resume-state.md
    line: 33
    quote: Serialize the entire agent state (context window + execution state + business state) to persistent
      storage. On resume, deserialize and continue from exactly where the agent paused.
  - file: docs/canonical/versioned-durable-agent-state.md
    line: 23
    quote: the source analysis names this failure as state that lives only in the context window and turns
      failures or payment events into amnesia
  - file: docs/canonical/closed-loop-agent-operating-system.md
    line: 54
    quote: orchestrator skill lines 27-62 defines a dashboard and priority logic for choosing the next
      task
  integration_value: High
  justification: 'Durable state across pauses and next-task selection exist, but the scheduling primitive
    itself is absent: no alarm scheduler where the agent sets its own next-wake, no wake trigger, no wake-work-sleep
    fleet lifecycle as a named pattern. Searched docs/canonical/, curriculum/, .opencode/skills/ for alarm|wake|sleep|scheduler|cron
    and agendamento|despertador|proxima tarefa — only the Kavak analysis files and unrelated matches.
    Core gap for a repo whose thesis is agents running for hours or days.'
- pattern_name: Agent-Per-Customer with Persistent Cross-Channel Memory
  classification: Partial Coverage
  evidence:
  - file: docs/canonical/auth-coupled-memory-architecture.md
    line: 24
    quote: Memory products treat storage and retrieval as independent of identity, but extracting the
      right memories requires knowing *who* the caller is.
  - file: docs/canonical/auth-coupled-memory-architecture.md
    line: 36
    quote: 'Identity resolution as memory key: Every memory item is stored with an identity key (phone
      number, account ID, session token, or device fingerprint).'
  - file: docs/canonical/auth-coupled-memory-architecture.md
    line: 61
    quote: NOT_FOUND across `docs/canonical/`, `curriculum/`, `system-of-record.md`, and `.opencode/skills/`
  - file: docs/canonical/three-tier-memory-persistence.md
    line: 51
    quote: 'three-tier memory "measurably improved resolution rate" through concrete memory applications:
      greeting customers by name (Tier 1), recalling previous call topics (Tier 1 + Tier 2)'
  - file: curriculum/04-nivel-4-koda-specific/02-customer-journey-flows.md
    line: 719
    quote: 'OBJETIVO: Construir relacionamento de longo prazo.'
  integration_value: Medium
  justification: 'Per-customer memory mechanics (identity-keyed memory, three-tier persistence, KODA long-term
    relationship goals with LTV metrics) are covered at canonical/curriculum level. Missing: one persistent
    agent instance per customer on its own VM (KODA is a single agent with per-customer state), years-spanning
    cross-channel ingestion, outcome ownership by the per-customer agent, and the portfolio constraint
    layer. Useful enrichment for the KODA N4 curriculum rather than a hole.'
- pattern_name: Goal-Driven Agents over Scripted Workflows
  classification: Partial Coverage
  evidence:
  - file: .opencode/skills/karpathy-guidelines/SKILL.md
    line: 148
    quote: '## 4. Goal-Driven Execution — Metas Verificaveis'
  - file: docs/canonical/value-gated-agent-control-loop.md
    line: 31
    quote: Add a value-gating decision point to the agent control loop that produces an explicit classification
      -- build, experiment, defer, or stop -- before execution begins
  - file: docs/canonical/symphony-trap-awareness.md
    line: 33
    quote: Replace "write spec then build" with "build then distill spec from what works then rebuild
      with the spec as a contract."
  - file: docs/system-of-record.md
    line: 234
    quote: 'intent-five-part-primitive.md | Intenção decomposta em cinco partes primitivas: goal, context,
      constraints, verification, handoff'
  - file: docs/system-of-record.md
    line: 283
    quote: 'business-outcome-first-eval-pipeline.md | Pipeline de eval ancorado em business outcomes:
      define success em termos de negócio → golden answers de domain experts → Python pipeline comparativo,
      deflection rate prediction'
  integration_value: Medium
  justification: 'Task-level goal-driven execution is deeply institutionalized (verifiable goals as stop
    criterion, value gates, goal as specification primitive, anti-upfront-spec stance, business-outcome-anchored
    evals). Missing is the strategic reframe: a hard persistent business objective owned by the agent
    over multi-week horizons, agent-owned decomposition, outcome-attainment measurement instead of step
    compliance, and the superhuman bar as architecture selector. Enrichment over existing depth, not a
    gap fill.'
- pattern_name: Scaffold Deletion on Model Step-Change
  classification: Better Implementation
  evidence:
  - file: docs/canonical/measured-harness-evolution-lifecycle.md
    line: 29
    quote: 'Treat harness evolution as a measured lifecycle, not as one-time architecture. Every component
      moves through four states: BUILD defensively, STABILIZE with production evidence, SIMPLIFY layer
      by layer, and REMOVE through archived, reversible removal'
  - file: docs/canonical/measured-harness-evolution-lifecycle.md
    line: 50
    quote: REMOVE is allowed when a component has fulfilled its purpose and removal remains reversible.
      The Budget Guard had zero triggers for 180 days after the 200K-token model migration
  - file: docs/canonical/measured-harness-evolution-lifecycle.md
    line: 60
    quote: 'Govern cadence with a quarterly cycle: week 1 reviews model changelogs, metrics, and component
      classification'
  - file: docs/canonical/invariant-compensation-split.md
    line: 23
    quote: the original Context Loader existed because a 32K-token model lost attention after 40 minutes;
      after a newer model held 98% accuracy at 100K tokens, that same component still cost 450ms, 1200
      tokens
  - file: docs/system-of-record.md
    line: 298
    quote: 'model-switch-driven-eval-hardening.md | Model-Switch-Driven Eval Hardening — hardening de
      evals dirigido por switch de modelo: cada troca de modelo dispara revalidação completa do dataset
      de eval (Sierra)'
  - file: curriculum/05-core-concepts/06-harness-evolution.md
    line: 156
    quote: 'Harness Evolution fecha o ciclo. Ele responde a pergunta que os outros 5 não respondem: "E
      quando o modelo melhorar? O que acontece com todo esse scaffolding que construímos?"'
  integration_value: Low
  justification: 'The repo''s canonical treatment is a more mature, governed version of the same idea:
    a measured BUILD/STABILIZE/SIMPLIFY/REMOVE lifecycle with ROI-threshold removal governance, quarterly
    model-changelog review, One In One Out, reversible archived removal, invariant-vs-compensation classification
    (which Kavak''s radical deletion lacks), and event-driven eval revalidation on every model switch.
    The curriculum teaches the exact question and the cycle restarting with less scaffolding. The only
    Kavak-specific delta is the organizational willpower framing of wholesale deletion — narrative, not
    mechanism.'
- pattern_name: Shared Fleet Learning
  classification: Partial Coverage
  evidence:
  - file: docs/canonical/production-failure-regression-flywheel.md
    line: 28
    quote: Every production failure that reveals a behavioral gap should become a durable eval regression
      case unless it is explicitly rejected as duplicate, unactionable, or out of scope.
  - file: docs/canonical/cross-context-knowledge-siloing.md
    line: 46
    quote: Knowledge created in one agent context becomes invisible to agents operating in a different
      context, causing repeated investigation of already-solved problems.
  - file: docs/canonical/confidence-gated-continual-learning.md
    line: 59
    quote: NOT_FOUND across `docs/canonical/`, `curriculum/`, `system-of-record.md`, and `.opencode/skills/`.
  - file: docs/canonical/confidence-gated-continual-learning.md
    line: 64
    quote: The flywheel daemon (`systemd`, 60s loop) processes triggers but deploys nothing — it surfaces
      findings for human review.
  - file: docs/canonical/closed-loop-agent-operating-system.md
    line: 35
    quote: Feedback writeback | Persist decisions, traces, failures, eval results, canonical docs, and
      issue outcomes | Updated memory for future agents
  integration_value: Medium
  justification: 'The capture side exists (failure-to-regression flywheel, monotonically growing eval
    dataset, feedback writeback as an OS surface) and the pathology is documented (cross-context knowledge
    siloing). Missing is the propagation channel: aggregating one agent''s mistake into a fleet-level
    skill/memory/policy update distributed to all running instances by the next day — the repo''s own
    continual-learning canonical declares auto-update deployment NOT_FOUND and the flywheel deploys nothing.
    A fleet-propagation doc would connect existing patterns; substantial adjacent infrastructure already
    exists.'
- pattern_name: Closed-Loop Help API (Humans Serve Agents)
  classification: Partial Coverage
  evidence:
  - file: docs/canonical/tested-degradation-ladder.md
    line: 29
    quote: escalates to a human with summarized context when automated recovery is insufficient, logs
      the outcome, and tests each rung before production reliance
  - file: docs/canonical/tested-degradation-ladder.md
    line: 65
    quote: The final rung must turn real failures into durable eval or regression coverage, because production
      failures should become regression cases
  - file: docs/canonical/operator-channel-authority.md
    line: 73
    quote: Genuine escalation still exists (see Institutional Safety-Valve Escalation Cycle) — but it
      flows *to* the operator's channel for a decision, not *between* peers as a substitute for one.
  - file: docs/analysis/2026-06-10-harness-evolution-metodos-construcao/2026-06-10-harness-evolution-metodos-construcao-classification.md
    line: 135
    quote: docs/canonical/multi-model-evaluation-council.md:37 through :45 defines retry, needs-human,
      disagreement escalation, and human review routing
  integration_value: Medium
  justification: 'Escalation with full context, outcome logging, and failure-to-training-data conversion
    all exist at canonical level. Missing is the inversion that defines the pattern: a help API the agent
    calls when stuck, the resolution flowing back into the agent that asked so it continues the task,
    and the humans-serve-agents organizational topology. The repo''s escalation is terminal (human takes
    over the case); no mechanism returns a resolution to the calling agent. Useful enrichment overlapping
    the flywheel''s training-data capture.'
- pattern_name: Sidekick Pattern at Physical Boundaries
  classification: Missing
  evidence: []
  integration_value: Low
  justification: 'NOT_FOUND. Searched: docs/canonical/ (full directory listing reviewed, no candidate),
    docs/decisions/, curriculum/, .opencode/skills/, docs/system-of-record.md, via greps for sidekick|co-pilot|copilot|ride.along|mechanic|voice
    note|nota de voz and destreza|dexterity|physical work|trabalho fisico|presenca fisica — matches only
    inside the Kavak analysis package itself. Nearest non-equivalents: presence-in-the-loop-metric.md
    and human-afk-task-routing-gate.md (docs/system-of-record.md:219, :235) calibrate human intervention
    in agent tasks (inverse direction of service); curriculum/10-references/model-capability-timeline.md:919-921
    mentions WhatsApp voice notes only as a client-facing latency feature, not worker telemetry feeding
    evals. Integration value Low: the pattern''s core value sits at physical-world boundaries outside
    this repo''s software-agent harness scope; only the telemetry-return-channel generalization transfers.'
- pattern_name: Evals-as-Brakes
  classification: Partial Coverage
  evidence:
  - file: docs/canonical/pr-gated-eval-enforcement.md
    line: 28
    quote: Require eval-specific reports on PRs that touch prompt, model, tool, context, memory, scoring,
      or agent-loop behavior.
  - file: docs/canonical/pr-gated-eval-enforcement.md
    line: 51
    quote: Block merge when thresholds fail unless an explicit waiver is recorded.
  - file: docs/canonical/accidental-brake-replacement.md
    line: 23
    quote: The danger is that an executive mandate to "move faster" or "remove bureaucracy" can eliminate
      the last remaining mechanism that prevents unchecked agentic construction, without anyone realizing
      what function it was serving.
  - file: docs/canonical/accidental-brake-replacement.md
    line: 50
    quote: Security review (takes 1 week) | Prevents vulnerable code from shipping | PR-Gated Eval Enforcement
      + automated security scanning at PR time
  - file: docs/canonical/confidence-gated-continual-learning.md
    line: 24
    quote: Agent improvement cycles face a tension between velocity and safety.
  integration_value: High
  justification: 'The brakes half exists at canonical depth: evals gate merges (PR-Gated Eval Enforcement),
    and the repo has an organizational brakes vocabulary (Manual Brake Question Gate, Accidental Brake
    Replacement mapping slow bureaucratic brakes to eval-based intentional replacements), plus a named
    velocity/safety tension (Confidence-Gated Continual Learning). Missing is the specific coupling rule
    — permitted shipping velocity set as a function of eval quality/coverage — and the response-to-risk
    reframe (improve the brakes rather than permanently slow down). NOT_FOUND for the coupling rule: searched
    docs/canonical/ and docs/system-of-record.md with ''velocity|shipping speed|go faster|go slow'' —
    only token-burn velocity (burn-rate-runtime-forecast.md:31,49) and the confidence-gate tension (confidence-gated-continual-learning.md:24).'
- pattern_name: Eval-Investment Parity
  classification: Partial Coverage
  evidence:
  - file: docs/canonical/eval-driven-development-timeline.md
    line: 28
    quote: 'Invest 6 weeks in evaluation infrastructure before any model experimentation or selection.
      The timeline is deliberately inverted from conventional development: evaluation is the first thing
      built, not the last.'
  - file: docs/canonical/pain-signal-eval-progression-gate.md
    line: 28
    quote: Treat eval maturity as a gate driven by pain signals instead of a calendar roadmap.
  - file: docs/canonical/pain-signal-eval-progression-gate.md
    line: 36
    quote: Approve only the smallest eval capability that addresses the observed pain.
  integration_value: Medium
  justification: 'Evals as first-class artifacts co-designed with agents exist at canonical depth (eval-first
    timeline, Living Eval Dataset, Eval Tier Stratification, full evals cluster), but the parity rule
    itself — a ~50/50 split of time/tokens/money between agents and evals — is absent, and the repo''s
    own investment philosophy is deliberately different: pain-signal gating mandates the smallest sufficient
    eval capability, explicitly rejecting proportional/calendar-driven allocation. NOT_FOUND for the parity
    rule: searched docs/ with ''parity|50/50|50%'' — only fixture parity (eval-tier-stratification.md:57)
    and Supabase mock parity in the issue-review skill, i.e., test-environment parity unrelated to budget
    allocation.'
- pattern_name: Outcome-Level Eval Hierarchy
  classification: Partial Coverage
  evidence:
  - file: docs/canonical/business-outcome-first-eval-pipeline.md
    line: 28
    quote: 'Invert the eval pipeline construction sequence: define business success first, then create
      golden answers from domain experts, then build the technical pipeline to compare agent outputs against
      business-aligned metrics.'
  - file: docs/canonical/business-outcome-first-eval-pipeline.md
    line: 46
    quote: '| Deflection | % of queries resolved without human intervention | 60% deflection rate |'
  - file: docs/canonical/business-outcome-first-eval-pipeline.md
    line: 22
    quote: This creates a misalignment where the technical eval passes but the business outcome fails
      — the agent is technically correct but business-irrelevant.
  - file: docs/canonical/eval-to-production-correlation-tracking.md
    line: 22
    quote: Eval scores become false safety signals when they stop predicting user outcomes.
  - file: docs/canonical/eval-to-production-correlation-tracking.md
    line: 35
    quote: '| Production outcomes | Task success, complaints, escalations, support tickets, CSAT proxy,
      latency, cost, retention, or domain-specific success metrics |'
  integration_value: Medium
  justification: 'The business-results-first anchor exists at canonical depth (Business-Outcome-First
    Eval Pipeline; Eval-to-Production Correlation Tracking with CSAT/retention/task-success outcomes and
    the false-safety-signal problem, which is the vanity-metric failure in other words). Missing: the
    explicit hierarchy as a single loop (measure business outcome → optimize agentic architecture → add
    skills where outcomes reveal gaps) and the named rejection of proxy KPIs (call counts, minutes on
    call) as a distinct failure class. NOT_FOUND for vanity-metric rejection: searched repo *.md with
    ''vanity|proxy KPI|superficial'' — matches unrelated (reward-hacking prevention via blind rubrics,
    curriculum/GLOSSARY.md:98).'
- pattern_name: Mega-Expert Consolidation
  classification: Missing
  evidence:
  - file: docs/canonical/persona-based-documentation.md
    line: 23
    quote: When a team has specialists in different domains, their expertise is not systematically captured
      in durable documentation surfaces that agents can load.
  - file: docs/canonical/goal-atomicity-split.md
    line: 92
    quote: Scales agent work by decomposition instead of by dense mega-prompts -- one outcome per intent
  integration_value: Medium
  justification: 'NOT_FOUND in any form (doc, code, skill, or curriculum). The mechanism — one agent per
    specialty benchmarked against the best individual human, then fused into a single customer-facing
    mega expert — has no coverage. Searched locations: docs/canonical/ (grep ''mega|specialist|superhuman|best
    human|deflection bot|fusion|consolidat|generalist'' — matches only the Kavak source package, the anti-pattern
    ''dense mega-prompts'' in goal-atomicity-split.md:92, and persona-based-documentation.md:23, which
    captures specialist knowledge as docs, not agent fusion); docs/system-of-record.md:172-299 (active
    canonical table — no consolidation/fusion entry); curriculum/ (no mega-expert or specialist-fusion
    content); .opencode/skills/ (skills table at docs/system-of-record.md:33-65 — no consolidation skill);
    docs/analysis/ (only the Kavak source package itself). Adjacent-but-different concepts confirmed:
    multi-agent-fault-tolerance (orchestration reliability), split-brain-planning-review (separate rubrics).'
- pattern_name: Production-Contact Training Loop
  classification: Partial Coverage
  evidence:
  - file: docs/canonical/on-policy-rollout-feedback-loop.md
    line: 33
    quote: An agent trained or evaluated only on curated scripts breaks when its own production trajectories
      contain early mistakes, strange tool outputs, or context drift that never appeared in the static
      data.
  - file: docs/canonical/on-policy-rollout-feedback-loop.md
    line: 41
    quote: 'Close the exposure-bias gap by making the agent''s own production trajectories the learning
      signal. ... Feed those scored prefixes back as update targets: prompt rules, skills, eval cases,
      memory policy, or training data. Then re-run the task against the updated agent and measure whether
      performance improved.'
  - file: docs/canonical/production-grounded-eval-sampling.md
    line: 22
    quote: Hand-authored eval sets miss real user distributions and long-tail agent failures.
  - file: docs/canonical/production-failure-regression-flywheel.md
    line: 28
    quote: Every production failure that reveals a behavioral gap should become a durable eval regression
      case unless it is explicitly rejected as duplicate, unactionable, or out of scope.
  - file: docs/canonical/living-eval-dataset.md
    line: 28
    quote: 'A **monotonically growing** eval dataset: every production incident, every escaped edge case,
      every new feature specification becomes a permanent addition to the dataset.'
  - file: curriculum/03-nivel-3-advanced-architecture/koda-applications/nivel-3-koda.md
    line: 1625
    quote: 'O replay de conversas reais anonimizadas deixa de ser uma atividade genérica e vira um artefato
      nomeado: `production_sampled_eval_corpus`.'
  - file: curriculum/02-nivel-2-practical-patterns/exercises/solutions/exercise-03-solution.md
    line: 2477
    quote: É a diferença entre um agente que **funciona no laboratório** e um agente que **funciona em
      produção, com clientes reais**, por horas a fio.
  integration_value: Medium
  justification: 'The mechanism is documented at depth: the On-Policy Rollout Feedback Loop states the
    convergence claim in exposure-bias terms and prescribes the exact loop (capture production traces
    → score → feed back as update targets → re-run and verify), supported by Production-Grounded Eval
    Sampling (harvesting infrastructure), the Production Failure Regression Flywheel, and the Living Eval
    Dataset; the curriculum teaches the lab-vs-production distinction explicitly. Missing: (a) the organizational
    stance that real-customer contact is the precondition for agents working at all — the on-policy doc
    still allows teacher-mixed/lab-side sampling for cold start, treating production contact as one option;
    and (b) the identity reframe that the harvested data and feedback loops ARE the agents rather than
    groundwork for them.'
- pattern_name: Carve-Out Pilot with Hard P&L Target
  classification: Partial Coverage
  evidence:
  - file: docs/canonical/domain-embedded-workflow-automation-wedge.md
    line: 38
    quote: '| Automation wedge | Small workflow slice with high pain, bounded scope, available data, clear
      owner, and testable outcome |'
  - file: docs/canonical/domain-embedded-workflow-automation-wedge.md
    line: 44
    quote: Prefer slices with clear before/after outcome evidence, not merely impressive model behavior.
  - file: docs/canonical/human-afk-task-routing-gate.md
    line: 35
    quote: '| Architecture | The change fits within existing module boundaries with a clear public interface
      | The change crosses module boundaries, introduces new abstractions, or has system-wide blast radius
      |'
  integration_value: High
  justification: 'Containment and outcome-anchored first slices exist: the Domain-Embedded Workflow Automation
    Wedge (bounded scope, testable outcome, before/after evidence), blast-radius containment at task/module
    level (Human-AFK Task Routing Gate, Architecture-as-Agent-Affordance), technical canary/shadow staging,
    and generic hard-goal machinery (Two-Implementations Goal Test, Intent Five-Part Primitive). Missing
    key mechanics: an agent installed as operator/CEO of a contained operating unit, a hard financial
    P&L target as the eval readout, and the daily plan-push/voice-note telemetry loop with human workers.
    NOT_FOUND for the pilot-unit/P&L mechanics: searched docs/canonical/ with ''pilot|carve|P&L|blast
    radius|isolated'' — blast-radius matches are module design (architecture-as-agent-affordance.md:38),
    review calibration (contextual-severity-calibration.md:25), and task routing; no document covers an
    agent running a contained business unit against a profit target.'
