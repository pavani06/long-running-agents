goals:
  - "Serve as knowledge base and curriculum for AI systems that operate reliably for hours or days without losing context, planning ability, or quality judgment. Sources: /mnt/c/Users/pavan/long-running-agents/README.md:12."
  - "Teach and operationalize harness engineering: long-run degradation is an engineering gap, not a model limitation; build support infrastructure around the model. Sources: /mnt/c/Users/pavan/long-running-agents/README.md:16, /mnt/c/Users/pavan/long-running-agents/README.md:18."
  - "Attack the three structural failures of long-running agents: context loss, fragile planning, blind self-evaluation. Sources: /mnt/c/Users/pavan/long-running-agents/README.md:24, /mnt/c/Users/pavan/long-running-agents/README.md:26, /mnt/c/Users/pavan/long-running-agents/README.md:27, /mnt/c/Users/pavan/long-running-agents/README.md:28, /mnt/c/Users/pavan/long-running-agents/README.md:30."
  - "Deliver the main product: a 12-week curriculum with 4 levels, 8 core concepts, 35+ diagrams, anchored on KODA (WhatsApp supplement-sales agent, 2+ hour conversations). Sources: /mnt/c/Users/pavan/long-running-agents/curriculum/README.md:13, /mnt/c/Users/pavan/long-running-agents/README.md:20, /mnt/c/Users/pavan/long-running-agents/docs/system-of-record.md:71, /mnt/c/Users/pavan/long-running-agents/curriculum/README.md:34."
  - "Run the automated external-knowledge pipeline analyze-and-improve (7 phases, evaluators, gates) that turns external sources into patterns classified against the repo and integrated as canonical docs, skills, or exercises. Sources: /mnt/c/Users/pavan/long-running-agents/README.md:102, /mnt/c/Users/pavan/long-running-agents/README.md:136."
  - "Provide a reusable agent-system template via .opencode (Handoff Protocol + skills layer). Sources: /mnt/c/Users/pavan/long-running-agents/README.md:140."
  - "Govern documentation by precedence: ADRs > canonical > evidence > analysis > archive > READMEs, resolved by the system of record. Sources: /mnt/c/Users/pavan/long-running-agents/docs/system-of-record.md:14-21, /mnt/c/Users/pavan/long-running-agents/AGENTS.md:80-91."
  - "Enforce agent operational discipline: one task per session, no assumptions, minimum viable change, verifiable success criteria, issue/branch traceability, real validation gates. Sources: /mnt/c/Users/pavan/long-running-agents/AGENTS.md:14-16, /mnt/c/Users/pavan/long-running-agents/AGENTS.md:26-32, /mnt/c/Users/pavan/long-running-agents/AGENTS.md:42-48, /mnt/c/Users/pavan/long-running-agents/AGENTS.md:69-78."
  - "Audience: business people skilled in building agents and agentic systems, from beginners to production operators. Sources: /mnt/c/Users/pavan/long-running-agents/README.md:34."

