terminology:
  - term: "Agent"
    definition: "Autonomous AI entity (usually LLM-based) that can take actions, use tools, and execute tasks in sequence."
    source: "/mnt/c/Users/pavan/long-running-agents/curriculum/GLOSSARY.md:17-24"
  - term: "Agent Loop"
    definition: "Repetitive cycle: receive input -> think -> act -> receive result -> repeat."
    source: "/mnt/c/Users/pavan/long-running-agents/curriculum/GLOSSARY.md:41-47"
  - term: "Harness / Harness Engineering"
    definition: "Support infrastructure that wraps the model and guarantees reliability in long executions; software engineering applied to the agent runtime."
    source: "/mnt/c/Users/pavan/long-running-agents/README.md:18"
  - term: "KODA"
    definition: "WhatsApp supplement-sales agent that must keep quality in 2+ hour conversations; the repository's anchor case."
    source: "/mnt/c/Users/pavan/long-running-agents/curriculum/README.md:34"
  - term: "HoP (House of Pace) / Handoff Protocol"
    definition: "Agent-system model where each agent has closed scope, an owner, and validation gates."
    source: "/mnt/c/Users/pavan/long-running-agents/docs/system-of-record.md:27"
  - term: "Amnesia (Context Amnesia)"
    definition: "Agent forgets prior context by exceeding the context window; solved by state persistence + memory management."
    source: "/mnt/c/Users/pavan/long-running-agents/curriculum/GLOSSARY.md:50-58"
  - term: "Compaction"
    definition: "Summarizing/compressing old context to make room while keeping key information (server-side when done by the server/model)."
    source: "/mnt/c/Users/pavan/long-running-agents/curriculum/GLOSSARY.md:81-87"
  - term: "Generator/Evaluator"
    definition: "Two-agent split: creative user-facing Generator with tight conversation window; impartial constraint-facing Evaluator with persisted state, rubrics, and approve/reject verdict."
    source: "/mnt/c/Users/pavan/long-running-agents/docs/canonical/generator-evaluator.md:29-31"
  - term: "Compartmented Evaluation Architecture"
    definition: "Builder and Validator receive sealed information surfaces to prevent reward-hacking (optimizing for visible checks instead of real outcomes)."
    source: "/mnt/c/Users/pavan/long-running-agents/curriculum/GLOSSARY.md:90-102"
  - term: "Constraint Budget Gate"
    definition: "Hard limit of 5-7 directional, unconditional, business-language constraints per task; surplus is reclassified as context or failure conditions."
    source: "/mnt/c/Users/pavan/long-running-agents/curriculum/GLOSSARY.md:106-118"
  - term: "Agent Degradation Loop Prevention"
    definition: "Diagnostic framework for the 4-link degradation loop: uneven context attention, compounding errors, external state fragmentation, inert memory feedback."
    source: "/mnt/c/Users/pavan/long-running-agents/curriculum/GLOSSARY.md:28-37"
  - term: "Closed-Loop Company"
    definition: "Agents read real company state (code, issues, artifacts) and return work and decision updates, closing the observation-execution cycle."
    source: "/mnt/c/Users/pavan/long-running-agents/curriculum/GLOSSARY.md:74-78"
  - term: "Architecture Decision Record (ADR)"
    definition: "Document recording a significant architecture decision, its context and consequences; top of documentation precedence."
    source: "/mnt/c/Users/pavan/long-running-agents/curriculum/GLOSSARY.md:61-68"
  - term: "System of Record"
    definition: "Source of truth: precedence, project domains, active patterns, ADR status."
    source: "/mnt/c/Users/pavan/long-running-agents/README.md:127"
  - term: "analyze-and-improve"
    definition: "Pipeline/harness that converts external sources into patterns classified against the repo and integrated as canonical docs, skills, or exercises."
    source: "/mnt/c/Users/pavan/long-running-agents/README.md:136"
  - term: "12-Factor Agents"
    definition: "Origin talk (Dex Horthy, AI Engineer 2025) of several canonical patterns (error-context-hygiene = Pattern 6, deterministic-tool-dispatch = Pattern 2, owned-agent-control-loop = Pattern 3, serializable-pause-resume-state = Pattern 4)."
    source: "/mnt/c/Users/pavan/long-running-agents/README.md:67, /mnt/c/Users/pavan/long-running-agents/docs/system-of-record.md:174-177"
  - term: "Skill-Canons Bridge"
    definition: "3-level bridging framework connecting ecosystem skills to the vault's canonical patterns."
    source: "/mnt/c/Users/pavan/long-running-agents/docs/decisions/2026-06-24-skill-canons-bridge-implementation.md:27-31"

