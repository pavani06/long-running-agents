meta:
  title: 'Classification: GTM AI Agents — Lessons from Deploying to 6,000 Users'
  source_slug: gtm-ai-agents-lessons-from-deploying-to-6000-users
  date: '2026-08-30'
  type: classification
  method: batch split 8+5 (deep agents in parallel), consolidated by orchestrator
patterns:
- name: Workflow-Derived Golden Question Set
  classification: Partial Coverage
  integration_value: Medium
  evidence:
  - file: docs/canonical/business-outcome-first-eval-pipeline.md
    line: 28
    quote: 'Invert the eval pipeline construction sequence: define business success first, then create
      golden answers from domain experts, then build the technical pipeline to compare agent outputs against
      business-aligned metrics.'
  - file: docs/canonical/business-outcome-first-eval-pipeline.md
    line: 55
    quote: Source ~200 real production queries from human agent logs (not synthetic queries). For each
      query, have a human domain expert author the expected correct response — the 'golden answer.'
  - file: docs/canonical/business-outcome-first-eval-pipeline.md
    line: 75
    quote: 'This enables evidence-based go/no-go deployment decisions: deploy when predicted deflection
      rate exceeds the business target, hold when it does not.'
  - file: docs/canonical/domain-embedded-workflow-automation-wedge.md
    line: 39
    quote: Domain eval seeds | Cases derived from observed work, including successful paths and exception
      paths
  - file: docs/canonical/repeatable-agent-spot-check-set.md
    line: 46
    quote: Choose 5-15 cases that cover the highest-value and highest-risk workflows.
  - file: docs/canonical/eval-driven-development-timeline.md
    line: 37
    quote: 'Golden answers: domain experts author correct responses for the initial ~200 queries; build
      the living eval dataset with categorization taxonomy'
  justification: 'Golden-answer machinery, workflow-derived eval seeds, and launch gating exist at canonical
    depth, but the repo''s golden answers are sourced from production query logs (requires a running system).
    Missing mechanics: the pre-build authoring pass (~150 questions from the extracted workflow artifact
    before any data is connected), the workflow-extraction artifact as question source, and the recorded
    first-run accuracy baseline (the 50% pre-launch catch). Would slot as Step 0 of Business-Outcome-First
    Eval Pipeline and into the N4/KODA production curriculum.'
- name: Quality-Over-Coverage Trust Scoping
  classification: Partial Coverage
  integration_value: Medium
  evidence:
  - file: docs/canonical/evals-as-brakes.md
    line: 32
    quote: 'Organizations respond to AI risk with the wrong dial: they slow down. ... Companies that go
      slow do so because they lack brakes (evals), not because slowness is safe'
  - file: docs/canonical/evals-as-brakes.md
    line: 34
    quote: shipping velocity and safety are treated as independent dials
  - file: docs/canonical/domain-embedded-workflow-automation-wedge.md
    line: 43
    quote: Choose a workflow slice that operators already perform repeatedly and painfully.
  - file: docs/canonical/carve-out-pilot-hard-target.md
    line: 41
    quote: Carve out one contained operating unit, install an agent in the standard harness as its operator
      (the 'AI CEO'), and make a hard P&L number the eval readout.
  - file: NOT_FOUND
    line: 0
    quote: '''trust'' (case-insensitive) in docs/canonical/ — zero matches (2026-08-30; matches exist
      only in docs/analysis/ packages and docs/articles/). NOT_FOUND for accuracy-zone mapping, launch-scope
      cut, or post-launch coverage roadmap in docs/canonical/, curriculum/, .opencode/skills/.'
  justification: 'Quality-gated shipping (Evals-as-Brakes) and narrow-first slicing (wedge rules, carve-out
    containment) are the two existing halves. Missing reframe: scoping the user-facing launch surface
    by accuracy zone (50 questions at 95% vs 100 at 70), the trust-asymmetry economics (first ~5 questions,
    10x recovery), the post-launch coverage roadmap, and demand-signal monitoring as the expansion trigger.
    No canonical doc frames trust as the unit of account for exposure scoping.'
- name: Retention-Gated Phased Rollout
  classification: Partial Coverage
  integration_value: Medium
  evidence:
  - file: docs/canonical/production-grounded-eval-sampling.md
    line: 107
    quote: staged shadow tests, canaries, production metrics, rollback, and observation exceed the canary
      gate pattern
  - file: docs/canonical/carve-out-pilot-hard-target.md
    line: 66
    quote: 'exit: [scale-to-next-city, iterate-harness, kill]'
  - file: docs/canonical/autonomy-curriculum-sampling.md
    line: 58
    quote: 'Readiness gates | Per-phase metrics that must pass before advancing lambda: task success rate,
      repair rate, unsafe-action rate, evaluator confidence'
  - file: docs/canonical/eval-to-production-correlation-tracking.md
    line: 35
    quote: Production outcomes | Task success, complaints, escalations, support tickets, CSAT proxy, latency,
      cost, retention, or domain-specific success metrics
  - file: NOT_FOUND
    line: 0
    quote: '''weekly-active'', ''beta cohort'', retention-gated GA, or request clustering in docs/canonical/,
      curriculum/, .opencode/skills/, docs/system-of-record.md — canonical ''retention'' matches are memory/data
      retention (docs/canonical/semantic-topic-bucketing.md:23, :27) or telemetry purge timers (docs/plans/2026-06-18-obs-fase5-runtime-integration.md:1448-1504).'
  justification: 'Staged rollout exists for infrastructure (shadow/canary/rollback) and pilots (carve-out
    with exit rule), with readiness gates on metrics. Missing the user-population axis: AI-native pilot
    cohort → 10% beta → GA gated on weekly-active retention (>70%) with request-concentration clustering
    defining must-have data. Retention appears only as a trackable outcome metric, never as a rollout
    gate.'
- name: Trial-Retention Attribution Split
  classification: Missing
  integration_value: Medium
  evidence:
  - file: NOT_FOUND
    line: 0
    quote: '''attribution'' in docs/canonical/ matches only token gap-cost attribution (docs/canonical/token-economics-gap-filling.md:33)
      and trace cost attribution (docs/system-of-record.md:202) — different axes. ''activation|adoption|trial''
      across docs/canonical/, curriculum/, .opencode/skills/, docs/system-of-record.md returns harness-adoption
      de-risking (docs/analysis/2026-06-15-canary-test/2026-06-15-canary-test-analysis.md:144), HoP role
      activation, and feature_activation log fields (curriculum/06-knowledge-graphs/02-koda-feature-dependencies.md:1973)
      — none equivalent.'
  - file: docs/canonical/eval-to-production-correlation-tracking.md
    line: 22
    quote: Eval scores become false safety signals when they stop predicting user outcomes.
  - file: docs/canonical/qa-to-backlog-feedback-loop.md
    line: 32
    quote: capture QA and review findings as structured observations, triage each finding for severity,
      blocker status, and ownership, convert actionable findings into vertical-slice issues or regression
      cases
  justification: 'The mechanism exists in no form: no per-user trial flag, no trial-vs-return diagnostic
    rule (tried-and-did-not-return → product problem; never-tried → change-management problem), no ownership
    routing of activation failures. The repo''s attribution patterns attribute token/trace cost; its misattribution
    discipline is eval-vs-production. Adjacent ownership routing (QA-to-backlog) routes review findings,
    not activation diagnostics.'
