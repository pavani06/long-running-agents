- name: Centralized Data Plane with Inherited RBAC
  classification: Partial Coverage
  integration_value: Medium
  evidence:
  - file: docs/canonical/auth-coupled-memory-architecture.md
    line: 32
    quote: An auth-coupled memory architecture where memory storage, retrieval, and sensitivity gating
      are all keyed by identity.
  - file: docs/canonical/auth-coupled-memory-architecture.md
    line: 36
    quote: 'Identity resolution as memory key: Every memory item is stored with an identity key (phone
      number, account ID, session token, or device fingerprint).'
  - file: docs/canonical/regulated-data-boundary.md
    line: 32
    quote: 'A regulated data boundary is an architectural isolation pattern: a separate infrastructure
      tier handling regulated operations that is physically isolated from LLM compute.'
  - file: docs/canonical/governance-context-injection-pii-prevention.md
    line: 22
    quote: Agents access enterprise data catalogs containing PII (SSN, phone, address, credit card numbers,
      customer names) but the model has no awareness of which fields are sensitive.
  - file: docs/analysis/2026-06-26-the-best-ai-agents-are-simpler-than-you-think-analysis.md
    line: 186
    quote: The platform's no-code layer, deterministic compilation, and Ghostwriter all serve this persona
      shift
  - file: NOT_FOUND
    line: 0
    quote: '''RBAC|role-based|data plane|zero-code'' in docs/canonical/ — matches only in the GTM source
      package, docs/canonical/persona-based-documentation.md:5 (role-based DOCUMENTATION aliases; not
      equivalent), and the simpler-than-you-think analysis. ''MCP'' — zero matches in docs/canonical/
      (2026-08-30).'
  justification: 'Agent data governance exists (identity-keyed access with confidence tiers, structural
    isolation boundary, data-catalog PII tagging) plus an analysis-level no-code adjacency. Missing the
    consolidation-and-inheritance architecture: unified first+third-party data platform, RBAC defined
    once at the plane, agents inheriting access controls automatically on zero-code deployment, fleet-consistent
    security posture. A unifying canonical would connect the three existing governance docs.'
- name: Skill Library as Instruction-Overflow Valve
  classification: Already Exists
  integration_value: Low
  evidence:
  - file: docs/canonical/resolver-based-context-progressive-disclosure.md
    line: 22
    quote: Monolithic instruction files degrade long-running agents. Every correction, preference, workflow,
      and domain rule gets loaded into every task, even when most of it is irrelevant. The result is token
      pressure, prompt interference, stale guidance, and context overflow.
  - file: docs/canonical/resolver-based-context-progressive-disclosure.md
    line: 24
    quote: The pattern solves instruction bloat by replacing always-on global context with resolver-driven,
      task-specific disclosure.
  - file: docs/canonical/resolver-based-context-progressive-disclosure.md
    line: 28
    quote: Move rarely universal instructions out of the base prompt and into skills or documents that
      the resolver loads only when the task matches their trigger contract.
  - file: docs/canonical/skill-resolver-skillify-capability-pipeline.md
    line: 28
    quote: Promote repeated agent work through a capability pipeline. A workflow is accepted as a real
      capability only after it becomes a routable skill with resolver metadata, tests, evals, storage
      expectations, and smoke evidence.
  - file: docs/system-of-record.md
    line: 33
    quote: Skills table listing the operational library; .opencode/skills/ directory listing 2026-08-30
      = 33 entries (implemented, not just documented; table spans :33-:65).
  - file: docs/system-of-record.md
    line: 186
    quote: Ledger explícito para calcular custo de prompt, reservas e saldo de tokens por passo (size-pressure
      instrumentation).
  - file: NOT_FOUND
    line: 0
    quote: '''MCP'' in docs/canonical/ — zero matches; no doc frames a hard instruction-size limit as
      the skill-extraction trigger (repo frames pressure as token cost).'
  justification: 'The valve mechanism is documented at canonical depth (instruction bloat → extract to
    skills → progressive disclosure on trigger), instrumented (token budget ledger), implemented (.opencode/skills/
    with 33 skills), and exceeds the source account in places (trigger contracts, negative triggers, skillify
    compliance stages). The only GTM deltas are contextual, not mechanical: hard instruction-window limits
    as extraction trigger and MCP orchestration-rule overflow (repo has zero MCP usage). Marginal enrichment
    is narrative (Snowflake 9-pages-to-skill-library trajectory) for the resolver/skillify canonicals.'
- name: Human-Review Staged Workflow Automation
  classification: Partial Coverage
  integration_value: Medium
  evidence:
  - file: docs/canonical/autonomy-curriculum-sampling.md
    line: 60
    quote: Phase progression | Observe (human does, agent watches) -> Assist (agent proposes, human approves)
      -> Own (agent executes, human monitors exceptions)
  - file: docs/canonical/domain-embedded-workflow-automation-wedge.md
    line: 47
    quote: Preserve operator review for cases where authority, risk, or missing data makes full automation
      unsafe.
  - file: docs/canonical/human-afk-task-routing-gate.md
    line: 30
    quote: The gate classifies every task as AFK-ready (safe for autonomous agent execution) or human-in-loop
      (requires human judgment before, during, or after execution).
  - file: docs/canonical/tested-degradation-ladder.md
    line: 29
    quote: escalates to a human with summarized context when automated recovery is insufficient, logs
      the outcome, and tests each rung before production reliance
  - file: NOT_FOUND
    line: 0
    quote: Staged automation of external actions with human-owned irreversible send (monitor → draft →
      review → send), channel monitors, or insight→action value staging in docs/canonical/, curriculum/,
      .opencode/skills/ ('draft|send|inbox|Slack|channel monitor' in canonical; 'MCP' — zero matches in
      docs/canonical/).
  justification: 'The human-review gate and graduated autonomy (propose→approve→own) are covered at canonical
    depth, plus routing and escalation. Missing the value-staging reframe: reviewed-draft automation of
    external-facing actions (monitor inbox/Slack → draft into Gmail → human reviews → human sends) as
    the deliberate second value rung beyond data Q&A, with the irreversible send human-owned and users
    self-adopting the staged flow as a trust builder. Repo review gates protect code/merge decisions,
    not outbound external actions.'
