- pattern: Unified Tool Surface Flywheel
  classification: Partial Coverage
  integration_value: High
  justification: 'Elementos existem isolados: interface universal para agentes (file-system materialization), autoridade unica de dispatch (deterministic-tool-dispatch) e flywheels de falha-para-melhoria
    (production-failure-regression-flywheel, closed-loop-help-api). Falta a mecanica central: uma unica tool authority exposta identicamente como UI, CLI e API publica, com agentes internos consumindo exatamente
    as mesmas tools — de forma que toda falha de tool do agente dobre como sinal de qualidade da API publica.'
  evidence:
