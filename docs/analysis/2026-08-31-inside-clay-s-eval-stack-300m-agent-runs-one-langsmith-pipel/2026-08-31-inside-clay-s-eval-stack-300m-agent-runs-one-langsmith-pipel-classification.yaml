- pattern: Structured Partial Checks over Exact Goldens
  classification: Partial Coverage
  integration_value: Medium
  justification: 'Os três componentes mecânicos existem, cada um profundo em doc canônico próprio: (a) asserções parciais estruturadas — verification matrix checa só as constraints explícitas; (b) asserções
    de trajetória — expected execution path templates; (c) goldens — golden question set e living eval dataset. Falta o reframe: a regra de casar estrictez com estabilidade do output (goldens exatos quebram
    em reordenação irrelevante → eval ruidoso → suite ignorada; reter goldens exatos só para superfícies simples). O repo pende para o lado oposto — golden answers humanas como mecanismo geral — sem a regra
    de restrição a superfícies estáveis.'
  evidence:
  - docs/canonical/constraint-anchored-evaluation.md:31-33 — verification matrix 'constraint -> check -> pass/fail -> violation detail'
  - docs/canonical/constraint-anchored-evaluation.md:52-59 — contraste com avaliação subjetiva de output completo
  - docs/canonical/behavioral-eval-path-analysis.md:76-83 — expected execution path templates por categoria de query (asserção de trajetória), mantidos junto aos golden answers
  - 'docs/canonical/3-layer-evaluation-architecture.md:36-39 — Layer 1: asserções estruturais de schema/formato'
  - docs/canonical/magnitude-direction-verifier-split.md:100 — verificação graduada (direção sobre magnitude exata)
  - docs/canonical/workflow-derived-golden-question-set.md:44-47 — golden set (~150 perguntas) para superfície restrita pré-launch
  - 'NOT_FOUND: nenhum doc formula o trade goldens-exatos-vs-checks-parciais como problema de ruído/confiança da suite (grep ''golden'' → 10 arquivos canônicos, lidos os 5 relevantes)'
  searched:
  - docs/canonical/ (grep golden; constraint-anchored; behavioral-eval; magnitude-direction; workflow-derived-golden; living-eval-dataset)
  - docs/decisions/
  - curriculum/05-core-concepts/08-evaluation-rubrics.md (via relações)
- pattern: Deterministic Multi-Turn Scripts over Simulated Users
  classification: Partial Coverage
  integration_value: Medium
  justification: 'A mecânica central existe canonizada: n-plus-one-long-session-evals carrega fixture fixo de N turnos (user turns hardcoded/derivados de traces reais) e testa o turno N+1 — multi-turn determinístico
    por construção. Fixtures derivados de conversas reais também existem (spot-check set com traces KODA reconstruídos; replay de produção). Falta a decisão explícita contra simulated-user LLM: o trade
    ''segundo agente não determinístico com manutenção própria; aposentar quando manutenção excede valor'' não é discutido em doc, código ou currículo.'
  evidence:
  - docs/canonical/n-plus-one-long-session-evals.md:28-38 — 'Load a realistic N-turn conversation fixture... Ask the next-turn prompt' (turnos fixos scriptados)
  - docs/canonical/n-plus-one-long-session-evals.md:38 — fixtures incluem follow-ups que referenciam produtos/decisões anteriores
  - docs/canonical/repeatable-agent-spot-check-set.md:59-60 — 4 traces KODA reais reconstruídos como casos repetíveis (seed traces)
  - docs/canonical/production-grounded-eval-sampling.md:40 — replay infrastructure (fixtures de produção)
  - 'NOT_FOUND: grep ''user simulator|usuário simulado|simulated-user|agente usuário'' em docs/ → apenas patterns.md:146 e analysis.md:88 do próprio pacote Clay'
  searched:
  - docs/canonical/ (n-plus-one, spot-check, production-grounded)
  - docs/ (grep simulated user PT/EN)
  - docs/analysis/2026-06-09-how-we-solved-context-management-in-agents/ (fonte do N+1)
  - curriculum/ (via N+1 references)
  - docs/decisions/
- pattern: Perceived-Eval
  classification: Missing
  integration_value: High
  justification: 'Nenhum doc, código ou currículo trata o comportamento de correção do usuário como dado de avaliação. Os componentes — detector de correction/pushback/redirection, métricas comportamentais
    (chat exit, stuck, rage quit), NPS como entrada contínua — não existem em forma alguma. Existem só vizinhos fracos: CSAT como proxy de outcome em lista de métricas de produção; always-on-monitoring-human-triage
    (anomalias do sistema, não qualidade percebida pelo usuário); presence-in-the-loop-metric (intervenção de operadores, não percepção de usuários).'
  evidence:
