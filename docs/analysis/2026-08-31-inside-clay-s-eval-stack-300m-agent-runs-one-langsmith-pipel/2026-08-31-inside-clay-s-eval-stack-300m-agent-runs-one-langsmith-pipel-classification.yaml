- pattern: Agent-First Data Foundation
  classification: Partial Coverage
  integration_value: High
  justification: 'A intuicao central (dados projetados para consumo de agente, nao para dashboard humano) existe formulada e a propria doc canônica de freshness declara a implementacao ausente; existe plataforma
    unificada first+third-party (Snowflake GTM) com foco em governanca. Falta o reframe Clay: agentes como usuario first-class de design-time, com a fragmentacao nomeada como gargalo concreto dos learning
    loops.'
  evidence:
