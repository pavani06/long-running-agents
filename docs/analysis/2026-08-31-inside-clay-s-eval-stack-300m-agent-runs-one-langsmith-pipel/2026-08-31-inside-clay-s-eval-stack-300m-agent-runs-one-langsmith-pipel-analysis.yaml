meta:
  title: "Inside Clay's Eval Stack: 300M Agent Runs, One LangSmith Pipeline - Analise de Conhecimento Nao-Obvio"
  source: "/mnt/c/Users/pavan/raw-knowledge/sources/2026-08-31-inside-clay-s-eval-stack-300m-agent-runs-one-langsmith-pipel.md"
  date: "2026-08-31"
  type: "analysis"
  domain: "evals"
  aliases: ["clay eval stack", "eval coverage matrix", "production-to-offline drift loop", "agent-first data foundation"]
  relates_to:
    - "[[docs/analysis/2026-06-10-eval-maturity-phases/2026-06-10-eval-maturity-phases-analysis|Eval Maturity Analysis]]"
    - "[[docs/system-of-record|System of Record]]"
  source_note: "Transcript inteiro em uma unica linha (linha 25); citacoes referenciam essa linha com trecho. Nomes normalizados da transcricao: Clagent/Clayun -> Claggent; lane chain/lang chain -> LangChain/LangSmith; engine -> bulk trace analysis do LangSmith; fable -> nome de modelo frontier ilegivel."

frameworks:
  - name: "Eval Coverage Matrix (deterministic/nondeterministic x offline/online)"
    components:
      - "Deterministico + offline: goldens, evoluindo para structured eval checks parciais e trajectory/tool assertions. Quote: 'deterministic and offline, you have goldens'. Source: ...pipel.md:25."
      - "Nao-deterministico + offline: LLM-as-judge e simulated user multi-turn evals. Source: ...pipel.md:25."
      - "Deterministico + online: metricas objetivas de A/B - latencia, custo, saida do chat para outras partes do produto, stuck, rage quitting. Source: ...pipel.md:25."
      - "Nao-deterministico + online: maior uso do LangSmith - online evaluators (NPS), perceived-eval (usuario corrigindo o agente), bulk trace analysis de producao, human eval de traces. Source: ...pipel.md:25."
      - "Meta do modelo: 'a few things in each of these boxes' - cobertura em todos os quadrantes, nao profundidade em um. Source: ...pipel.md:25."
  - name: "Eval Tiers por Ambiente (fidelidade crescente)"
    components:
      - "Local: barato e rapido, propositalmente sem sandbox e sem VFS ('locally, we don't care... We don't have a sandbox. We don't have a VFS'). Source: ...pipel.md:25."
      - "CI/staging: 'as close to your production harness as possible', com staging 'basically using the same thing as prod'. Source: ...pipel.md:25."
      - "Principio organizador: 'meet your developers where they are'. Source: ...pipel.md:25."
  - name: "Production -> Offline Feedback Loop com taxonomia de drift"
    components:
      - "A seta de retorno producao->offline e 'the hardest part to set up'; eval/production drift e 'still an unsolved problem in the agent eval space'. Source: ...pipel.md:25."
      - "Data drift: casos de uso de producao nao sao os testados pelo time em bug bashing. Source: ...pipel.md:25."
      - "Judge drift: LLM judges tem vieses internos; hill-climbing em um judge especifico = overfitting nele. Source: ...pipel.md:25."
      - "Eval-set mirroring: eval set pequeno faz o prompt 'mirror just those eval examples'. Source: ...pipel.md:25."
      - "Contramedidas: exemplos de online evaluators, customer support tickets, human-annotated goldens para judge drift, use-case classifiers + tagging para cobertura. Source: ...pipel.md:25."
  - name: "Tool Unification Flywheel (UI = CLI = API)"
    components:
      - "Tudo fazivel na UI deve existir no CLI e na API publica. Source: ...pipel.md:25."
      - "Sculptor usa 'the exact same tools that we expose via the CLI and API' - agentes internos e externos compartilham tools. Source: ...pipel.md:25."
      - "Flywheel: falhas de invocacao/trajetoria geram user signal -> melhoram harness ou tools -> beneficiam todos inclusive agentes externos. Sinais por bulk analysis automatizada e human vibe-based eval. Source: ...pipel.md:25."
  - name: "Agent-First Data Foundation (data lake)"
    components:
      - "First-party e third-party data num unico plano que agentes rodam sobre, 'agents being the first class user'. Source: ...pipel.md:25."
      - "Requisitos: guardrails up front, shadow builds de data models em S3, separacao serving/development compute, skills + CLI, long-running goals (1-2h) com Athena e compute escalavel. Source: ...pipel.md:25."
      - "Origem do problema: quatro fontes disparates - traces no LangSmith, Snowflake, Postgres, ClickHouse. Source: ...pipel.md:25."
  - name: "Self-Iterating Agent Loop"
    components:
      - "Dados de clientes + third-party -> orquestracao -> execucao -> observacao -> feedback. Source: ...pipel.md:25."
      - "Alvo: 'all parts of the product are feeding into a single unified data foundation that agents can reason over and build better iterations of themselves'. Source: ...pipel.md:25."
  - name: "Threshold de Escala como Gatilho de Eval"
    components:
      - "Gatilhos explicitos: 300M+ runs/mes (Claggent) e 100K+ mensagens/semana (Sculptor), 'past that threshold of where we could actually look at every trace or talk to every customer'. Source: ...pipel.md:25."
      - "Abaixo do threshold evals 'were not great'; acima, eval 'became non-negotiable'. Source: ...pipel.md:25."
  - name: "Evals como Habilitador de Desenvolvimento Agentic"
    components:
      - "Com boa eval suite, agentes de codigo (Claude, Codex, Devon) fazem mudancas de prompt com garantia de nao 'shipping anything that is going to ruin production'. Source: ...pipel.md:25."

patterns:
  - name: "CLI-first eval harness com persistencia remota"
    problem: "Suites que exigem provisionar experimento em plataforma criam atrito que mata o uso."
    mechanism: "'Everything is just like a command line eval suite'; roda local sem sandbox/VFS e todo resultado e escrito no LangSmith ('persistent in version... even though it's run locally writes out there'), unindo ergonomia local a durabilidade central. Source: ...pipel.md:25."
  - name: "Plug-and-play harness com BYO evaluators"
    problem: "Cada novo produto/agente reconstruir harness de avaliacao."
    mechanism: "Harness unico compartilhado; novos produtos trazem so a eval suite e os proprios evaluators (LLM judges); 'the rest of the harness is there for them and it's plug-and-play'. Source: ...pipel.md:25."
  - name: "Structured partial checks no lugar de goldens exatos"
    problem: "Goldens quebram com reordenacao irrelevante de keywords/nos e 'noisy evals just end up getting ignored'."
    mechanism: "Checks que avaliam apenas 'the parts of the query that we actually care about', mais tolerantes; trajectory/tool assertions verificam o percurso (ex.: pergunta de pricing exige leitura da tabela de precos). Goldens mantidos so para superficies simples como query language. Source: ...pipel.md:25."
  - name: "Deterministic multi-turn em vez de simulated-user LLM"
    problem: "Avaliar agentes multi-turn sem introduzir segunda fonte de nao-determinismo."
    mechanism: "Duas variantes: agente-usuario simulado alimentado com traces passados vs turns hardcoded; veredito: 'deterministic multi-turn evals were actually the most useful'; o simulado era 'another agent that you had to manage and keep up to date and also have evals for'. Source: ...pipel.md:25."
  - name: "Sinais implicitos de satisfacao como online evaluators"
    problem: "Medir qualidade percebida em producao continuamente."
    mechanism: "Perceived-eval: usuario corrigindo o agente, 'pushing back', tentando guia-lo = sinal negativo; combinado com NPS e metricas comportamentais (sair do chat, stuck, rage quit). Source: ...pipel.md:25."
  - name: "Superficie unica de tools (interno = externo)"
    problem: "Divergencia entre o que o produto expoe e o que os proprios agentes usam duplica superficie e esconde falhas."
    mechanism: "Mesmas tools de API/CLI dadas aos agentes internos; falhas de invocacao em producao viram sinal para melhorar tool/harness, melhorando a API publica como efeito colateral. Source: ...pipel.md:25."
  - name: "Shadow builds com separacao serving/development compute"
    problem: "Agentes construindo data models nao podem por producao em risco."
    mechanism: "Agentes deployam data models em S3 como shadow builds; seguranca vem de 'separating out our serving and our development compute' - 'running some experiments and not bringing down prod'. Guardrails up front. Source: ...pipel.md:25."
  - name: "Skills + CLI como camada de acesso de agente a dados"
    problem: "Agentes precisam acessar dados nativamente sem adaptadores humanos."
    mechanism: "Investimento em skills e CLI proprios; long-running steps orientados a goal ('I want this data model', 1-2h) executando em Athena/compute escalavel. Source: ...pipel.md:25."
  - name: "Consolidacao de datastores como desbloqueio de agentes"
    problem: "LangSmith + Snowflake + Postgres + ClickHouse forcavam agentes a 'tie together all these different databases'."
    mechanism: "Unificacao em uma data platform ('this has enabled our agents to do more'), transformando o datastore em 'a playground for agents'. Fragmentacao tratada como bloqueio arquitetural. Source: ...pipel.md:25."
  - name: "Evals-first para tarefas longas de dados"
    problem: "Delegar tarefas de dados de horas sem criterio de sucesso definido."
    mechanism: "'Setting up evals first and driving towards those agents can go and do things with your data' - a eval suite precede e dirige a autonomia. Source: ...pipel.md:25."

operational_lessons:
  - lesson: "Evals ruins no inicio sao a norma; escala corrige a prioridade."
    context: "'When we first built out some of our agentic products, our evals were not great'; o que mudou foi volume (bilhoes de runs) e tarefas end-to-end longas. Source: ...pipel.md:25."
  - lesson: "A eval suite e pre-requisito para delegar mudancas de prompt a agentes de codigo."
    context: "Claude/Codex/Devon fazendo prompt changes com seguranca de nao arruinar producao - eval como condicao de autonomia, nao acompanhamento. Source: ...pipel.md:25."
  - lesson: "Goldens funcionam so em superficies simples."
    context: "Confirmado para query language; em outputs complexos quebram por reordenacao e sao ignorados. Source: ...pipel.md:25."
  - lesson: "Eval ruidoso e eval morto."
    context: "'Noisy evals just end up getting ignored' - stricness do check deve casar com a estabilidade do que se afirma. Source: ...pipel.md:25."
  - lesson: "Determinismo ganha de realismo em multi-turn."
    context: "Hardcoded user turns foram o formato mais util; simulated user custa mais para manter do que entrega. Source: ...pipel.md:25."
  - lesson: "A seta producao->offline e a parte mais dura do sistema de evals."
    context: "Mais dificil que qualquer avaliador individual; data drift, judge drift e eval-set mirroring sao os tres modos de falha nomeados. Source: ...pipel.md:25."
  - lesson: "Support tickets sao fonte de alta qualidade de sinal de cliente."
    context: "Usados junto com online evaluators e goldens human-anotados para alimentar o loop offline. Source: ...pipel.md:25."
  - lesson: "Human vibe-based eval continua valendo junto de checks automatizados."
    context: "'Usually my favorite' - avaliacao humana de traces complementa o flywheel automatizado. Source: ...pipel.md:25."
  - lesson: "Step change de modelo frontier habilitou analise in-context em massa."
    context: "Com o modelo citado como 'fable' ficou possivel 'look at these 10,000 examples and find trends', substituindo a pratica vibe-based de olhar poucos exemplos; sub-agents, goals e harnesses novos completam a habilitacao. Source: ...pipel.md:25."
  - lesson: "Fragmentacao de datastores era o gargalo concreto dos learning loops."
    context: "'Hard to scale this with our data primitives' - nao falta de modelos ou evals, mas de unificacao de dados. Source: ...pipel.md:25."

tradeoffs:
  - decision: "Goldens exatos apenas para superficies simples; partial checks para o resto."
    benefit: "Determinismo e simplicidade onde o output e estavel."
    cost: "Goldens em outputs complexos quebram por reordenacao irrelevante e viram ruido ignorado. Source: ...pipel.md:25."
  - decision: "Multi-turn deterministico (turns hardcoded) em vez de simulated-user LLM."
    benefit: "Estabilidade, zero manutencao de segundo agente."
    cost: "Cobertura menos realista de conversas; o simulado exige 'manage and keep up to date and also have evals for'. Source: ...pipel.md:25."
  - decision: "Local propositalmente sem sandbox/VFS; staging = prod."
    benefit: "Iteracao local barata e rapida."
    cost: "Local nao reproduz producao; compensado pelo tier de staging identico a prod. Source: ...pipel.md:25."
  - decision: "Tudo pela CLI, com escrita automatica em LangSmith."
    benefit: "Zero atrito de provisionamento ('you don't have to go to lchain and start an experiment')."
    cost: "Menor riqueza de interface local, mitigada pela persistencia central versionada. Source: ...pipel.md:25."
  - decision: "Expor tools publicamente (API/CLI) e da-las aos agentes internos."
    benefit: "Flywheel de melhoria via falhas observadas + valor para clientes-agentes."
    cost: "Superficie publica maior e falhas visiveis. Source: ...pipel.md:25."
  - decision: "Migracao para data lake unificado."
    benefit: "First + third party num plano so, agentes first-class, shadow builds, tarefas longas em escala."
    cost: "Migracao arquitetural de quatro sistemas (LangSmith, Snowflake, Postgres, ClickHouse). Source: ...pipel.md:25."
  - decision: "Separar serving e development compute."
    benefit: "Experimentos e shadow builds sem derrubar prod."
    cost: "Reconhecidamente incomum para startups ('which isn't the case for a lot of startups I know') - custo de infraestrutura duplicada. Source: ...pipel.md:25."
  - decision: "Hill-climbing com LLM judge."
    benefit: "Grading automatico escalavel."
    cost: "Overfitting no vies interno do judge; mitigado com human-annotated goldens e rotatividade de exemplos. Source: ...pipel.md:25."

failure_patterns:
  - pattern: "Eval rot por ruido"
    cause: "Goldens com stricness maior que a estabilidade do output (keyword/node ordering muda e quebra)."
    mitigation: "Partial checks que so olham o que importa + trajectory assertions; consequencia nao mitigada: 'noisy evals just end up getting ignored'. Source: ...pipel.md:25."
  - pattern: "Data drift (producao != teste)"
    cause: "Eval sets construidos do que o time conhece e faz bug bashing."
    mitigation: "Use-case tagging contra producao; importacao de exemplos de online evaluators. Source: ...pipel.md:25."
  - pattern: "Judge drift"
    cause: "Hill-climbing continuo em um unico LLM judge com vieses internos."
    mitigation: "Human-annotated goldens como referencia para detectar o desvio. Source: ...pipel.md:25."
  - pattern: "Prompt mirroring do eval set"
    cause: "Hill-climbing com eval set pequeno."
    mitigation: "Rotatividade/ampliacao do set via sinais de producao e support tickets. Source: ...pipel.md:25."
  - pattern: "Simulated-user como componente podre"
    cause: "Agente-usuario ruidoso que exige ciclo proprio de manutencao e eval."
    mitigation: "Substituir por turns hardcoded deterministicos. Source: ...pipel.md:25."
  - pattern: "Experimento derruba producao"
    cause: "Serving e development compute compartilhando infraestrutura."
    mitigation: "Separacao de compute + shadow builds de data models em S3. Source: ...pipel.md:25."
  - pattern: "Dados fragmentados bloqueiam agentes"
    cause: "Quatro datastores (LangSmith, Snowflake, Postgres, ClickHouse) exigindo costura pelos agentes."
    mitigation: "Data lake unificado como plano unico de execucao. Source: ...pipel.md:25."
  - pattern: "Sinais comportamentais de falha em producao (stuck, rage quit, saida do chat)"
    cause: "Usuario que nao consegue avancar na conversa ou abandona o agente."
    mitigation: "Tratados como metricas deterministicas online que delimitam falha percobida em A/B. Source: ...pipel.md:25."

synthesis: >
  Tese cruzada nao nomeada pelo autor: eval e uma propriedade da superficie do produto, nao dos testes. Cada decisao aparentemente nao-eval - UI=CLI=API, agentes internos usando as tools publicas, unificar quatro datastores num data lake - e decisao de avaliacao: reduzir o numero de superficies que podem divergir multiplica os pontos onde sinal de falha pode ser coletado e devolvido ao loop offline; o flywheel e a arquitetura de dados sao a infraestrutura da dotted arrow producao->offline. Segunda tese: determinismo e o recurso escasso - a hierarquia observavel e (1) assercao parcial deterministica, (2) multi-turn hardcoded, (3) LLM judge, (4) agente simulado, e cada passo em direcao ao nao-determinismo adiciona um componente que precisa das proprias evals, updates e controle de drift; componentes cujo meta-trabalho excede o valor sao cortados. Terceira: o threshold de escala, nao a maturidade, e o gatilho de investimento - o mesmo time conviveu com evals ruins enquanto pôde olhar traces; a incapacidade estrutural de observar (300M runs/mes) torna eval non-negotiable e, em seguida, torna seguro delegar o proprio desenvolvimento (mudancas de prompt por agentes de codigo) a essa eval suite. A maturacao descrita e um caso concreto do modelo em docs/analysis/2026-06-10-eval-maturity-phases, com acrescimo do quadrante online-nao-deterministico e da taxonomia de drift como areas abertas.
