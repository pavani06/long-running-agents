meta:
  title: "Classificacao Batch 2: Agentic Patterns from Clay's Eval Stack (300M Agent Runs, One LangSmith Pipeline)"
  date: 2026-08-31
  type: 'classification-batch'
  batch: 2
  source: "docs/analysis/2026-08-31-inside-clay-s-eval-stack-300m-agent-runs-one-langsmith-pipel/2026-08-31-inside-clay-s-eval-stack-300m-agent-runs-one-langsmith-pipel-patterns.yaml"
  target_repository: "long-running-agents"
  precedence: "docs/system-of-record.md:14-21 (decisions/ > canonical/ > evidence/ > analysis/ > curriculum/ > READMEs)"
classifications:
  - pattern: "Unified Tool Surface Flywheel"
    classification: "Partial Coverage"
    integration_value: "High"
    justification: >-
      Elementos existem isolados: interface universal para agentes (file-system materialization),
      autoridade unica de dispatch (deterministic-tool-dispatch) e flywheels de
      falha-para-melhoria (production-failure-regression-flywheel, closed-loop-help-api).
      Falta a mecanica central: uma unica tool authority exposta identicamente como UI, CLI e
      API publica, com agentes internos consumindo exatamente as mesmas tools — de forma que
      toda falha de tool do agente dobre como sinal de qualidade da API publica.
    evidence:
      - "docs/canonical/file-system-materialization.md:48 — espectro de materializacao; agente opera 'using the same tools it would use for any software project'"
      - "docs/canonical/file-system-materialization.md:34 — 'the interface should be designed for the agent's strengths'"
      - "docs/system-of-record.md:178 — deterministic-tool-dispatch.md (12FA Padrao 2): autoridade unica de dispatch"
      - "docs/canonical/production-failure-regression-flywheel.md:28 — 'Every production failure that reveals a behavioral gap should become a durable eval regression case'"
      - "docs/system-of-record.md:312 — closed-loop-help-api.md (Kavak): resolucao vira training data"
      - "docs/analysis/2026-08-30-kavak-s-playbook-for-rebuilding-a-company-around-ai/2026-08-30-kavak-s-playbook-for-rebuilding-a-company-around-ai-classification.md:38 — 'universal tooling surface' analogo; implementacao concreta NOT_FOUND"
    searched:
      - "grep 'tool surface|single tool|same tools|UI, CLI|UI/CLI|public API' em *.md do repo — apenas docs/canonical/file-system-materialization.md:48 e o pacote-fonte Clay"
      - "NOT_FOUND: unica tool authority servindo UI+CLI+API; agentes internos = mesmas tools de clientes externos; agent tool failure como sinal de qualidade da API publica"

  - pattern: "Shadow Builds on Separated Compute"
    classification: "Partial Coverage"
    integration_value: "Medium"
    justification: >-
      Mecanicas adjacentes existem em profundidade: shadow deployment de comparacao (curriculo),
      staged shadow tests + canary + rollback (Better Implementation declarada pelo repo para
      rollout gates) e worktree isolado por issue. Falta o nucleo Clay: alvo de deploy shadow
      para artefatos construidos por agentes e separacao arquitetural entre serving compute e
      development compute, com guardrails up-front concedendo autonomia de build.
    evidence:
      - "curriculum/05-core-concepts/02-planning-execution-separation.md:2190-2199 — receita shadow deployment: clonar trafego, rodar em paralelo, sandbox, promover em 98%+"
      - "docs/analysis/2026-06-10-eval-maturity-phases/2026-06-10-eval-maturity-phases-classification.md:121-131 — Better Implementation de Canary Eval Rollout Gate (staged shadow tests, canary 5/25/100%, rollback)"
      - ".opencode/skills/issue-start/SKILL.md:72,82 — git worktree isolado por issue: execucao separada por construcao"
      - "docs/system-of-record.md:247 — shadow-review-pipeline.md: shadow de revisao pre-merge (mecanica distinta de shadow build)"
    searched:
      - "grep 'shadow build|shadow deploy|shadow deployment|separated compute|dev compute|serving compute' em *.md — apenas pacote-fonte Clay e 02-planning-execution-separation.md:2190"
      - "grep 'Athena|\\bS3\\b' — nenhuma ocorrencia de shadow deployment target"
      - "NOT_FOUND: shadow target (S3) para data models de agentes; planos serving vs development compute; guardrails up-front como porta de autonomia de build"

  - pattern: "Agent-First Data Foundation"
    classification: "Partial Coverage"
    integration_value: "High"
    justification: >-
      A intuicao central (dados projetados para consumo de agente, nao para dashboard humano)
      existe formulada e a propria doc canônica de freshness declara a implementacao ausente;
      existe plataforma unificada first+third-party (Snowflake GTM) com foco em governanca.
      Falta o reframe Clay: agentes como usuario first-class de design-time, com a fragmentacao
      nomeada como gargalo concreto dos learning loops.
    evidence:
      - "docs/canonical/agent-specific-data-freshness-pipeline.md:22 — 'Data pipelines built for human consumption... Agents treat every data point literally'"
      - "docs/canonical/agent-specific-data-freshness-pipeline.md:86 — 'No data pipelines designed for agent consumption rather than human dashboard consumption' (gap declarado)"
      - "docs/canonical/agent-specific-data-freshness-pipeline.md:93 — 'Data quality becomes a first-class engineering concern — 60% of project time... data foundation'"
      - "docs/canonical/centralized-data-plane-inherited-rbac.md:44 — 'Plataforma unificada de dados | Consolida first-party + third-party em um unico plano'; :68-70 consolidacao como pre-requisito ausente"
      - "docs/analysis/2026-06-26-the-production-ai-playbook-deploying-agents-at-enterprise-sc/2026-06-26-the-production-ai-playbook-deploying-agents-at-enterprise-sc-analysis.md:375 — ferramentas de dados evoluiram para consumo humano; agentes nao tem essa tolerancia"
    searched:
      - "grep 'data foundation|unified data|data platform|fragmented datastore|cross-database' em *.md — cobertura parcial em freshness/RBAC/production-playbook, sem framing agent-first de plataforma"
      - "grep 'first class user|first-class user' — apenas pacote-fonte"
      - "NOT_FOUND: agentes como design-time first-class users; datastore como playground; compute escalavel Athena-class"

  - pattern: "Skills and CLI as Native Agent Data Access"
    classification: "Partial Coverage"
    integration_value: "Medium"
    justification: >-
      O repo opera a mecanica no proprio metabolismo: 35 skills agente-orientadas, CLI
      obsidian-eval para scan/query do vault, substrato de arquivos como interface universal,
      delegacao goal-level e execucao longa com estado persistente. Falta o pareamento
      especifico: skills + CLI dedicados como acesso nativo a uma plataforma de dados
      unificada, com execucoes goal-level de 1-2h em compute escalavel cujo output e novo
      data model.
    evidence:
      - "docs/system-of-record.md:36-67 — 35 skills em .opencode/skills/ como superficie operacional primeira-classe dos agentes"
      - "README.md:159 — CLI obsidian-eval (@pavani/obsidian-eval) para scan, query, grafo e cross-vault wikilinks; docs/system-of-record.md:127"
      - "docs/canonical/file-system-materialization.md:38,48 — arquivos/git/grep como interface universal para agentes"
      - "docs/canonical/goal-driven-agents-over-workflows.md:37 — hard goal + full tool/API access + persistence; :54 — agente sobrevive ao horizonte da tarefa com plano proprio"
      - "docs/system-of-record.md:180 — serializable-pause-resume-state.md: base canonica de execucao longa (harness.sh + PROGRESS.md)"
    searched:
      - "grep 'dedicated CLI|goal-level|1-2 hours|long-running goal' em *.md — sem correspondencia fora do pacote-fonte"
      - "NOT_FOUND: skills/CLI como camada de acesso a data platform; execucao 1-2h em compute escalavel com output = novo data model"

  - pattern: "Eval-Gated Autonomy"
    classification: "Already Exists"
    integration_value: "Low"
    justification: >-
      Cada componente existe em profundidade canonica e a regra de acoplamento central —
      autonomia/velocidade como funcao da qualidade do eval — esta formulada verbatim em
      evals-as-brakes.md. O gate mecanico (pr-gated-eval-enforcement), o sequenciamento
      evals-first (eval-driven-development-timeline), a graduacao para automacao
      (comment-decay-readiness-signal) e mudancas aprovadas sem revisao humana por diff
      (semantic-rule-gated-auto-approve-block) estao todos ativos. O delta Clay (autor da
      mudanca ser agente) e coberto pelos docs de auto-approve e graduacao.
    evidence:
      - "docs/canonical/evals-as-brakes.md:43 — 'permitted shipping velocity is a function of eval quality and coverage' (regra de acoplamento canonica)"
      - "docs/canonical/evals-as-brakes.md:49-63 — tiers auto-merge/daily-batch/manual-gate atrelados a cobertura de eval (auto-merge requer eval_coverage >= 0.9)"
      - "docs/canonical/pr-gated-eval-enforcement.md:28,51 — eval report obrigatorio em PRs que tocam prompt/model/tool/loop; 'Block merge when thresholds fail'"
      - "docs/system-of-record.md:289 — eval-driven-development-timeline.md: 6 semanas de infra de eval antes de qualquer experimentacao (evals-first sequencing)"
      - "docs/canonical/comment-decay-readiness-signal.md:42,60 — graduacao para automacao com criterio explicito; tier auto-merge readiness eval-based"
      - "docs/system-of-record.md:329 — semantic-rule-gated-auto-approve-block.md (Qodo): auto-approve sem revisao humana por diff"
      - "docs/system-of-record.md:262,303 — autonomy-curriculum-sampling (observe-assist-own) e model-agnostic-agent-vm-harness (swap gateado por evals)"
    searched:
      - "grep 'eval gate|eval-gated|autonomy as a function' — mecanica plenamente coberta em canonicas ativas; nada estrutural a acrescentar"

  - pattern: "Observability-Threshold Eval Trigger"
    classification: "Partial Coverage"
    integration_value: "Medium"
    justification: >-
      O repo tem gatilhos de investimento em evals maduros, mas pain-based (reativo, sinal de
      dor) e nao capacity-based (estrutural, incapacidade humana de observar). A decisao binaria
      Clay — abaixo do threshold tolerar evals leves; acima (incapacidade estrutural de
      inspecionar traces/contatar clientes) investimento nao-negociavel — nao existe.
    evidence:
      - "docs/canonical/pain-signal-eval-progression-gate.md:28 — 'eval maturity as a gate driven by pain signals instead of a calendar roadmap'; :36 — menor capacidade que resolve a dor observada"
      - "docs/system-of-record.md:321 — pull-based-infrastructure-on-pain.md: endurecimento reativo puxado por dor, nao por antecipacao"
      - "docs/analysis/2026-06-10-eval-maturity-phases/2026-06-10-eval-maturity-phases-analysis.md:31 — volume como sinal de saida de fase, nao como threshold de capacidade humana"
      - "docs/system-of-record.md:313 — eval-investment-parity.md: quanto investir, nao quando se torna obrigatorio"
      - "docs/system-of-record.md:282 — eval-dashboard-primary-detection-surface.md: resposta ao volume sem o gatilho que a justifica"
    searched:
      - "grep 'human observation|inspect every trace|observation capacity|maturity theater' em *.md — zero matches fora do pacote-fonte"
      - "grep 'trace volume' — apenas docs/canonical/centralized-cross-framework-tracing.md:162 (framing de custo)"
      - "NOT_FOUND: modelo de capacidade de observacao humana; regra 'structural inability to observe -> investimento nao-negociavel'"

  - pattern: "Bulk In-Context Trace Analysis"
    classification: "Partial Coverage"
    integration_value: "High"
    justification: >-
      Analise de traces existe em profundidade (Layer 3 comportamental, tracing centralizado,
      classificacao LLM de logs em escala, guia e licao inteira de trace reading) — mas os
      mecanismos sao deterministicos por-item ou classificacao LLM por-item em taxonomia. O
      mecanismo Clay — ~10k traces in-context a um frontier model com goal de trend-finding,
      substituto escalavel do vibe review — e ausente, incluindo o frontier-model step change
      como habilitador.
    evidence:
      - "docs/canonical/behavioral-eval-path-analysis.md:34 — Layer 3 consome traces completos via algoritmos deterministicos; :158-165 — logica de consumo NOT_FOUND no repo"
      - "docs/canonical/llm-classified-log-taxonomy.md:48,53 — classificacao LLM de ~40k perguntas/semana com tiering e amostragem (por item, nao sintese in-context)"
      - "docs/system-of-record.md:291 — centralized-cross-framework-tracing.md: text-to-SQL query interface; :162 — trace volume em escala enterprise"
      - "curriculum/07-implementation-guides/05-trace-analysis-guide.md — guia de analise de traces; curriculum/02-nivel-2-practical-patterns/04-trace-reading.md (5.089 linhas, webpage/analise-arquitetural.md:13)"
      - "curriculum/05-core-concepts/08-evaluation-rubrics.md:5923 — Always-On Monitoring comprime 10.000 conversas -> 5 para revisao humana (direcao oposta)"
    searched:
      - "grep '10k examples|bulk trace|in-context.*trace|large trace sample' em *.md — sem mecanica de analise in-context em massa fora do pacote-fonte"
      - "grep '10\\.000' — apenas escala de volume/curriculo, nunca como tamanho de amostra de analise LLM"
      - "NOT_FOUND: submissao in-context de amostra grande a frontier model; trend-finding prompts; findings -> eval cases como pipeline nomeado"

  - pattern: "Self-Iterating Agent Loop"
    classification: "Partial Coverage"
    integration_value: "High"
    justification: >-
      O repo tem multiplos loops fechados canonicos (closed-loop agent OS, fleet learning,
      regression flywheel, GC meta-loop) e a analise Kavak registra o recursive self-improvement
      no nivel organizacional. Falta a composicao-alvo: todos os elos operando sobre uma fundacao
      de dados unificada, com agentes raciocinando sobre o feedback acumulado para construir
      iteracoes melhores de si mesmos — os loops do repo melhoram harness/evals/docs, nao o
      agente via substrato de dados.
    evidence:
      - "docs/canonical/closed-loop-agent-operating-system.md:28-37 — quatro superficies do loop (intake, prioridade, roteamento, feedback writeback)"
      - "docs/canonical/shared-fleet-learning.md:37 — loop erro -> comportamento da frota; :62-63 — 'deploys nothing': captura sem deploy (elo fraco nomeado)"
      - "docs/canonical/production-failure-regression-flywheel.md:28 — falhas viram casos de regressao duraveis"
      - "docs/system-of-record.md:229 — garbage-collection-day-meta-loop.md: meta-loop semanal; 'accumulating harness leverage'"
      - "docs/analysis/2026-08-30-kavak-s-playbook-for-rebuilding-a-company-around-ai/2026-08-30-kavak-s-playbook-for-rebuilding-a-company-around-ai-analysis.md:53 — 'aim the recursive self-improvement loop at the organization'"
      - "docs/system-of-record.md:294 — confidence-gated-continual-learning.md: gate que tornaria auto-iteracao segura"
    searched:
      - "grep 'self-iterat|self-improv|build better iterations|iterate on themselves' em *.md — apenas pacote-fonte e loop local de calibracao (contextual-severity-calibration.md:106)"
      - "NOT_FOUND: 'single unified data foundation that agents can reason over' como substrato; agentes construindo better iterations of themselves; doc unico unindo orchestration+execution+observation+feedback sobre o mesmo plano de dados"
