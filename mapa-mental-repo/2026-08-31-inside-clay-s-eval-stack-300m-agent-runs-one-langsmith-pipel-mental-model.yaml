terminology:
- term: Agent
  definition: Entidade autônoma de IA (baseada em LLM) que toma ações, usa ferramentas e executa tarefas em sequência
  source: curriculum/GLOSSARY.md:17-24
- term: Agent Loop
  definition: 'Ciclo repetitivo: input → pensa → ação → resultado → repete'
  source: curriculum/GLOSSARY.md:41-47
- term: Context Window
  definition: Total de tokens que o modelo processa por vez; memória imediata do agente
  source: curriculum/GLOSSARY.md:158-168
- term: Context Amnesia
  definition: Agente esquece contexto anterior por exceder a janela
  source: curriculum/GLOSSARY.md:50-57
- term: Context Rot
  definition: Perda gradual de coerência conforme o agente avança na janela
  source: curriculum/GLOSSARY.md:149-155
- term: Context Anxiety
  definition: Comportamento ansioso/precipitado próximo ao limite de contexto
  source: curriculum/GLOSSARY.md:138-145
- term: Harness
  definition: Infraestrutura e padrões que envolvem agentes para torná-los confiáveis por períodos longos (state persistence, planning, evaluation loops, coordenação)
  source: curriculum/GLOSSARY.md:370-383
- term: Harness Evolution
  definition: Simplificar/remover componentes de harness conforme o modelo melhora
  source: curriculum/GLOSSARY.md:387-399
- term: Token
  definition: Unidade básica de texto processada pelo LLM (~4 caracteres)
  source: curriculum/GLOSSARY.md:770-780
- term: Token Budget / Token Accounting
  definition: Gerenciamento consciente de quantos tokens se usa/tem disponível
  source: curriculum/GLOSSARY.md:783-794
- term: METR
  definition: Model Evaluation Task Completion Rate — % de tarefas completas com sucesso; benchmark de duração com 50% de sucesso
  source: curriculum/GLOSSARY.md:474-481
- term: Generator
  definition: Agente responsável por construir/criar; trabalha em par com Evaluator
  source: curriculum/GLOSSARY.md:320-330
- term: Evaluator
  definition: Agente separado que avalia e grava o trabalho de um Generator, contra rubrics
  source: curriculum/GLOSSARY.md:220-232
- term: Generator/Evaluator Pattern
  definition: 'Duas entidades separadas: uma gera, outra avalia; elimina sycophancy e fecha o loop de validação cego'
  source: curriculum/GLOSSARY.md:333-352
- term: Sycophancy
  definition: Tendência de LLMs em agradar, aprovando qualidade inferior
  source: curriculum/GLOSSARY.md:754-764
- term: Sprint
  definition: Unidade de trabalho bem-definida, 30-120 minutos de tempo de agente
  source: curriculum/GLOSSARY.md:734-744
- term: Sprint Contract
  definition: Acordo negociado entre generator e evaluator sobre o que 'pronto' significa antes de começar
  source: curriculum/GLOSSARY.md:191-199
- term: Evaluation Rubric
  definition: Critérios mensuráveis para avaliar qualidade subjetiva
  source: curriculum/GLOSSARY.md:236-253
- term: Trace
  definition: Log detalhado de cada passo do agente (input, reasoning, ações, output); loop de debugging principal
  source: curriculum/GLOSSARY.md:830-845
- term: Verification Loop
  definition: Ciclo gerador cria → verificador testa → feedback retorna
  source: curriculum/GLOSSARY.md:867-880
- term: MCP
  definition: Model Context Protocol — protocolo para agentes usarem ferramentas/recursos externos
  source: curriculum/GLOSSARY.md:499-508
- term: Multi-Agent System
  definition: Múltiplos agentes independentes que coordenam entre si; padrão comum Planner + Generator + Evaluator
  source: curriculum/GLOSSARY.md:512-524
- term: Compaction
  definition: Resumir/comprimir contexto antigo para abrir espaço, mantendo informações-chave
  source: curriculum/GLOSSARY.md:81-87
- term: KODA
  definition: Agente conversacional de venda de suplementos via WhatsApp; case study e aplicação prática de todos os padrões
  source: curriculum/GLOSSARY.md:457-468
- term: ICE Craft Separation
  definition: 'Três crafts com donos explícitos: Intent (outcome owner), Context (harness), Expectations (outcome owner); impede que um documento monolítico misture os três'
  source: curriculum/GLOSSARY.md:419-432
- term: Intent as Five-Part Primitive
  definition: 'Intent formalizado em 5 campos obrigatórios: description, constraints, failure scenarios, success scenarios, connections; validado por Intent Completeness Gate'
  source: curriculum/GLOSSARY.md:436-451
- term: Human-Owned Expectations Boundary
  definition: Definição de 'pronto' é artefato de autoria exclusiva do outcome owner; harness consome mas não modifica
  source: curriculum/GLOSSARY.md:403-413
- term: Goal Atomicity Split
  definition: Cada goal é uma frase sem conjunções; cada 'e' conectando ações independentes é ponto de split
  source: curriculum/GLOSSARY.md:304-316
- term: Two-Implementations Goal Test
  definition: Se duas implementações substancialmente diferentes não podem ambas satisfazer, é especificação mascarada de goal
  source: curriculum/GLOSSARY.md:849-861
- term: Token Economics of Gap-Filling
  definition: 'Atribuição de custo: agentes que preenchem lacunas de ICE durante a execução queimam exponencialmente mais tokens por outcome'
  source: curriculum/GLOSSARY.md:797-810
- term: Constraint Budget Gate
  definition: Limite rígido de 5-7 constraints direcionais, incondicionais, em linguagem de negócio por tarefa
  source: curriculum/GLOSSARY.md:106-118
- term: Constraint-Failure Decision Rule
  definition: 'Pergunta-âncora: ''saber isso mudaria como o Builder escreve código?'' Se sim → constraint; se não → failure condition'
  source: curriculum/GLOSSARY.md:122-134
- term: Compartmented Evaluation Architecture
  definition: Builder e Validator recebem superfícies de informação seladas; impede reward-hacking contra checks visíveis
  source: curriculum/GLOSSARY.md:90-102
- term: Relational Context Graph
  definition: 'Substitui retrieval por similaridade por seleção relacional; edges tipados: dependency, provenance, supersession, causation'
  source: curriculum/GLOSSARY.md:612-621
- term: Deliberate Forgetting
  definition: 'Esquecimento como operação de primeira classe: relevance evaluator, promotion/demotion engine, discard logger, budget gate'
  source: curriculum/GLOSSARY.md:205-214
- term: Smallest Sufficient Context
  definition: 'Subconjunto mínimo para raciocinar sobre o passo atual: sufficiency estimator, relational traversal, order-preserving assembler, capacity profiler'
  source: curriculum/GLOSSARY.md:697-706
- term: Tiered Context Storage
  definition: Três tiers hot/warm/cold com Tier Orchestrator que promove/demote por relevância
  source: curriculum/GLOSSARY.md:814-826
- term: Neutral Selection Layer
  definition: 'Camada de seleção de contexto model-agnostic e vendor-independent: neutra, horizontal, estruturada'
  source: curriculum/GLOSSARY.md:530-541
- term: Selection-Budgeted Retrieval
  definition: Candidatos rankeados por valor/custo em tokens; contramedida ao Link 4 do degradation loop
  source: curriculum/GLOSSARY.md:661-670
- term: Context Health Monitoring
  definition: Effective context size, near-miss rate, contradiction rate agregados em health score contínuo; detecta aproximação do cliff
  source: curriculum/GLOSSARY.md:171-180
- term: Agent Degradation Loop Prevention
  definition: '4 links do loop de degradação: atenção desigual, erros compostos, fragmentação de estado, feedback inerte de memória; interceptores específicos por link'
  source: curriculum/GLOSSARY.md:28-37
- term: LLM as Fuzzy Compiler
  definition: Source = constraints de domínio; compiler = harness; backend = modelo; código gerado é build descartável
  source: curriculum/GLOSSARY.md:271-285
- term: Persona-Based Documentation
  definition: Cada especialista documenta sua especialidade como NFR durável; agentes carregam personas relevantes ao diff
  source: curriculum/GLOSSARY.md:574-588
- term: Failure Pattern Classification Loop
  definition: 'Ritual semanal: revisar falhas, classificar por taxonomia (context_loss, tool_misuse, ...), converter padrões recorrentes em guardrails'
  source: curriculum/GLOSSARY.md:258-267
- term: Garbage Collection Day
  definition: Meta-loop semanal convertendo feedback humano em guardrails automatizados do harness
  source: curriculum/GLOSSARY.md:291-300
- term: Presence-in-the-Loop Metric
  definition: 'Mede envolvimento humano DURANTE a execução: presence timeline, stale-presence warnings, intervention checkpoints, review confidence signal'
  source: curriculum/GLOSSARY.md:592-606
- term: Closed-Loop Company
  definition: Agentes leem estado real da empresa e devolvem trabalho/bugs/atualizações fechando o ciclo observação→execução
  source: curriculum/GLOSSARY.md:74-78
- term: Skillify Pipeline
  definition: 'Hardening que transforma workflow em skill roteável e testada: unit tests, LLM evals, resolver trigger, smoke test, schema'
  source: curriculum/GLOSSARY.md:654-658
- term: Ralph Loop
  definition: Agente em loop incremental resolvendo um task por iteração (Jeffrey Huntley, jul 2025); padrão anterior, substituído por generator/evaluator
  source: curriculum/GLOSSARY.md:625-641
- term: ADR
  definition: Architecture Decision Record — registra decisão significativa, contexto e consequências
  source: curriculum/GLOSSARY.md:61-68
- term: System of Record
  definition: Mapa das fontes canônicas; resolve divergências por precedência (ADRs > canonical > evidence > analysis > archive > READMEs)
  source: docs/system-of-record.md:12-21
- term: Handoff Protocol (HoP)
  definition: 'Modelo de agentes em .opencode/: cada agente tem escopo fechado, dono e gates de validação'
  source: docs/system-of-record.md:27
curriculum:
  levels:
  - level: 1
    name: Fundamentos
    directory: curriculum/01-nivel-1-fundamentals/
    focus: Por que agentes falham
    load: 3-4h
    topics: why-agents-lose-plot, token-budgeting, basic-harness-patterns + exercises + koda-applications
  - level: 2
    name: Padrões Práticos
    directory: curriculum/02-nivel-2-practical-patterns/
    focus: Padrões de confiabilidade aplicáveis
    load: 6-8h
    topics: generator/evaluator, sprint contracts, rubric design, trace reading + exercises (two-implementations, goal-atomicity, intent-five-part)
  - level: 3
    name: Arquitetura Avançada
    directory: curriculum/03-nivel-3-advanced-architecture/
    focus: Sistemas multi-agente sofisticados
    load: 8-10h
    topics: multi-agent systems, state persistence, file-based coordination, server-side compaction, harness evolution + 16 exercícios
  - level: 4
    name: Aplicação KODA
    directory: curriculum/04-nivel-4-koda-specific/
    focus: Aplicação prática contínua no KODA
    load: contínuo (10+h)
    topics: KODA architecture, customer journeys, feature design patterns, rubrics KODA, harness improvements + real-world exercises + case studies
  concepts:
  - 01-context-management (curriculum/05-core-concepts/)
  - 02-planning-execution-separation
  - 03-generator-evaluator-pattern
  - 04-sprint-contracts
  - 05-state-persistence
  - 06-harness-evolution
  - 07-multi-agent-coordination
  - 08-evaluation-rubrics
  support_layers:
  - curriculum/06-knowledge-graphs/ — 35+ diagramas Mermaid (concept-ecosystem, koda-feature-dependencies, learning-progression, problem-solution-mapping + detailed-graphs)
  - curriculum/07-implementation-guides/ — setup, team progression, harness design checklist, trace analysis, harness evolution playbook
  - 'curriculum/08-tools-templates/ — templates: sprint contract, rubric, ADR, progress tracker, knowledge graph'
  - curriculum/09-case-studies/ — retro-game-maker, browser-daw-app, 3× KODA (discovery, order, fulfillment)
  - curriculum/10-references/ — anthropic presentation, model capability timeline, additional resources
  satellite_exercise_dirs:
  - curriculum/03-nivel-arquiteto/exercises/ (owner-of-no-role)
  - curriculum/03-nivel-3-operational/exercises/ (shadow-review-pipeline, contextual-severity-calibration)
  - curriculum/04-nivel-3-engenharia-avancada/exercises/ (behavioral-eval-path-analysis)
  master_documents:
  - MASTER_PLAN.md — mapa completo, roadmap semanal, progress tracking
  - QUICK_START.md — onboarding 45 min
  - INDEX.md — navegação por perfil
  - EXECUTION_PLAN.md — cronograma 12 semanas
  - GLOSSARY.md — ~50 termos com níveis e Ver também
  - FAQ.md (em construção)
  - DELIVERY-COMPLETE.md, tag-suggestions.yaml
  progression: Fundamentos conceituais → padrões aplicáveis → arquitetura de sistema → aplicação contínua no caso real KODA; cada nível tem critérios de conclusão checkáveis e roadmap semanal com deliverables
    (curriculum/MASTER_PLAN.md:196-330)
  source_materials: rawfiles/ (material-fonte) e prompts/ (prompts de geração) — docs/system-of-record.md:96-97
