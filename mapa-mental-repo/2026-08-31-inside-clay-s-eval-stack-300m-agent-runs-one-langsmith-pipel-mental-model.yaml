goals:
- 'Base de conhecimento e currículo para agentes long-running confiáveis: sistemas de IA que operam por horas ou dias sem perder contexto, planejamento ou julgamento de qualidade (README.md:12).'
- 'Documentar, ensinar e operacionalizar harness engineering: degradação de agentes longos é lacuna de engenharia, não de modelo; harness é a infraestrutura de suporte ao redor do modelo (README.md:16-18).'
- 'Atacar três falhas estruturais de execuções longas: perda de contexto, planejamento frágil, autoavaliação cega (README.md:24-30).'
- 'Entregar o currículo como produto principal: 12 semanas, 4 níveis, 8 conceitos core, 35+ diagramas, ancorado no caso real KODA — agente de venda de suplementos via WhatsApp com conversas de 2+ horas
  (curriculum/README.md:13,34; docs/system-of-record.md:72-74).'
- 'Rodar pipeline automatizado de análise de conhecimento externo: harness analyze-and-improve em 7 fases com evaluators e gates, convertendo fontes externas em canonical docs, skills e exercícios (README.md:102,136;
  .opencode/skills/analyze-and-improve/SKILL.md:49-57).'
- 'Servir de template de sistema de agentes reutilizável: .opencode/ com Handoff Protocol, 35 skills e 3 agentes (README.md:103-104,140).'
- 'Governar documentação por precedência: ADRs > canonical > evidence > analysis > archive > READMEs via system of record (docs/system-of-record.md:14-21).'
- 'Disciplina operacional de agentes: uma tarefa por sessão, não assumir, mudança mínima, sucesso verificável, issues/branches traceáveis, gates reais (AGENTS.md:14-16,18-32,42-78).'
- 'Audiência: pessoas de negócio com skill em construção de agentes, de iniciantes a operadores de produção (README.md:34).'
architecture:
  abstractions:
  - name: System of Record
    role: Fonte da verdade; precedência de 6 níveis; define domínios do projeto (agentes/orquestração, currículo/conteúdo, portal web, stack/tooling, governança, testes/QA); cataloga padrões ativos, análises
      e ADRs
    evidence: docs/system-of-record.md:12-21,23-153
  - name: Biblioteca de padrões canônicos
    role: 'Camada autoritativa Level 2: 161 docs, cada um problema/mecanismo/trade-offs, frontmatter type: canonical, relates-to obrigatório, wikilinks'
    evidence: docs/system-of-record.md:171; listagem docs/canonical/ 2026-08-31; ex. docs/canonical/generator-evaluator.md:1-17
  - name: Currículo
    role: 'Produto principal: 4 níveis + 8 conceitos core + knowledge graphs + guias + templates + case studies + referências + documentos mestres'
    evidence: curriculum/README.md:13; curriculum/MASTER_PLAN.md:50-190
  - name: Pipeline analyze-and-improve
    role: '7 fases (0-6) delegadas a sub-agentes (ultrabrain/deep/quick): mental model → extraction → patterns → classification → artifacts → integration → curriculum integration; Phase 0 e 1 podem rodar
      em paralelo'
    evidence: .opencode/skills/analyze-and-improve/SKILL.md:49-57,105
  - name: Harness de execução
    role: harness.sh (loop) + PROGRESS.md (estado persistente) + test-results.json default-FAIL + guardian (valida evidência) + STEER.md/AGENT_STOP (redirecionamento e kill switch humanos)
    evidence: harness/GUIDE-analyze-and-improve.md §1-3
  - name: Sistema de agentes HoP (House of Pace)
    role: '3 agentes: hop-orchestrator-rezek (primary: governança, fonte de verdade, coordenação), koda-hop-init-basic (inicialização guiada KODA), hop-live-whatsapp-tester (teste live WhatsApp)'
    evidence: .opencode/agents/ (3 arquivos); docs/system-of-record.md:33-35
  - name: Biblioteca de skills
    role: '35 skills com SKILL.md: issue workflow, orquestração, análise, documentação, planos, error hygiene, gates, decomposição de intenção, métricas, anti-sycophancy'
    evidence: .opencode/skills/ (35 dirs); docs/system-of-record.md:36-67
  - name: Cache de modelos mentais
    role: mapa-mental-repo/ versiona modelos mentais do repo (max 5 ativos, archive/ além, remoção >90 dias); alimenta modo incremental do pipeline
    evidence: .opencode/skills/analyze-and-improve/SKILL.md:160-172
  - name: Convenções Obsidian + validação
    role: 'Rule 16: frontmatter por tipo de doc, wikilinks [[path|display]], tags derivadas dos domínios do SOR, relates-to hard error, slug lowercase-hyphen, validador scripts/validate-obsidian.ts'
    evidence: AGENTS.md:136-257
  - name: Camadas de apresentação
    role: 3 dashboards Obsidian (dataview), 3 portais HTML vanilla JS + 1 proposta SPA, 35+ diagramas Mermaid no currículo, canvas Obsidian
    evidence: README.md:105,110-121
  - name: Stack e tooling
    role: Node >= 20.18.0 ESM, ESLint 10 + plugin-n + unicorn + 2 regras customizadas (no-catch-message, no-raw-console-in-scripts), Makefile, obsidian-eval CLI (@pavani/obsidian-eval) cross-vault
    evidence: package.json; README.md:153-161; docs/system-of-record.md:114-131
  relationships:
  - 'SOR governa tudo: conflitos entre docs resolvem-se pela precedência (AGENTS.md:80-91 espelha docs/system-of-record.md:14-21)'
  - 'Pipeline → repositório: outputs Phase 0-4 em docs/analysis/<date>-<slug>/; artefatos concretos da Phase 4 em docs/canonical/, .opencode/skills/, curriculum/; Phase 5 atualiza SOR e índices (.opencode/skills/analyze-and-improve/SKILL.md:140-158)'
  - 'Modelo mental é insumo canônico: Phase 3 classifica padrões da fonte externa contra este modelo — contagens precisam estar corretas'
  - 'Agentes → canonical: cada agente declara fonte de verdade apontando ao SOR e a canonical docs (.opencode/agents/hop-orchestrator-rezek.md:23-29)'
  - 'Currículo ↔ canonical ↔ glossário: lições referenciam padrões via wikilink; glossário define termos com Ver também para canonical docs e níveis (curriculum/GLOSSARY.md)'
  - 'ADRs > canonical: única ADR aceita (Skill-Canons Bridge) documenta decisões cross-cutting e revisitas pendentes (docs/decisions/2026-06-24-skill-canons-bridge-implementation.md:33-93)'
  - 'Análises alimentam padrões: 28 dirs de análise (12FA, eval maturity, Matt Pocock, IDSD, memory selection, Kavak, Snowflake GTM, Qodo, macro fund, MHC/KODA backend) são proveniência da maioria dos 161
    canonical docs (docs/system-of-record.md:344-452)'
  - 'Formato de sessão de análise: pós-2026-06-14 usa <date>-<source-slug>-artifacts.{md,yaml}; antes disso integration-roadmap.md legacy (docs/system-of-record.md:447-452)'
  - 'Disciplina de sessão: Rule 0 (uma tarefa por sessão) e Rule 17 (coletar background results só após ALL COMPLETE, em batch) regem a operação do pipeline (AGENTS.md:14-16,259-272)'
