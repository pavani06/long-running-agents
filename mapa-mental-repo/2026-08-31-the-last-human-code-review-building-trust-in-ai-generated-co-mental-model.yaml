terminology:
  - {term: "Agent (Agente)", definition: "Entidade autônoma de IA (geralmente LLM) que toma ações, usa ferramentas e executa tarefas em sequência.", source: "curriculum/GLOSSARY.md:17-24"}
  - {term: "Agent Loop", definition: "Ciclo repetitivo input → pensa → ação → resultado → repete.", source: "curriculum/GLOSSARY.md:41-47"}
  - {term: "Harness / Harness Engineering", definition: "Infraestrutura de suporte que envolve o modelo e garante confiabilidade em execuções longas; engenharia de software aplicada ao runtime do agente.", source: "README.md:18"}
  - {term: "KODA", definition: "Agente de venda de suplementos via WhatsApp; caso âncora do repositório, conversas de 2+ horas.", source: "curriculum/README.md:34; README.md:20"}
  - {term: "HoP (House of Pace) / Handoff Protocol", definition: "Modelo do sistema de agentes: cada agente tem escopo fechado, dono e gates de validação; handoff carrega estado confirmado.", source: "docs/system-of-record.md:27; .opencode/agents/hop-orchestrator-rezek.md:21"}
  - {term: "Amnesia (Context Amnesia)", definition: "Agente esquece contexto anterior por exceder a janela; solução: state persistence + memory management.", source: "curriculum/GLOSSARY.md:50-58"}
  - {term: "Compaction", definition: "Resumir/comprimir contexto antigo para abrir espaço mantendo informações-chave (server-side quando feito pelo servidor).", source: "curriculum/GLOSSARY.md:81-87"}
  - {term: "Context Anxiety", definition: "Comportamento ansioso/com pressa ao se aproximar do limite de contexto; respostas curtas e decisões precipitadas.", source: "curriculum/GLOSSARY.md:138-145"}
  - {term: "Context Rot", definition: "Perda gradual de coerência conforme o agente avança na janela de contexto.", source: "curriculum/GLOSSARY.md:149-150"}
  - {term: "Generator/Evaluator", definition: "Dois agentes: Generator (criativo, janela de conversa) e Evaluator (imparcial, constraints/rubrics/estado persistido) com veredicto approve/reject.", source: "docs/system-of-record.md:216; README.md:82"}
  - {term: "Compartmented Evaluation Architecture", definition: "Builder e Validator recebem superfícies de informação seladas para impedir reward-hacking.", source: "curriculum/GLOSSARY.md:90-102"}
  - {term: "Constraint Budget Gate", definition: "Limite de 5-7 constraints direcionais, incondicionais e em linguagem de negócio por tarefa; excedentes viram contexto ou failure conditions.", source: "curriculum/GLOSSARY.md:106-118"}
  - {term: "Constraint-Failure Decision Rule", definition: "Pergunta-âncora 'saber isso mudaria como o Builder escreve código?' classifica item como constraint ou failure condition.", source: "curriculum/GLOSSARY.md:122-134"}
  - {term: "Agent Degradation Loop Prevention", definition: "Framework diagnóstico dos 4 elos do loop de degradação: atenção desigual, erros que se compõem, fragmentação de estado externo, feedback inerte de memória.", source: "curriculum/GLOSSARY.md:28-37"}
  - {term: "Closed-Loop Company", definition: "Agentes leem estado real da empresa e devolvem trabalho/decisões fechando o ciclo observação → execução.", source: "curriculum/GLOSSARY.md:74-78"}
  - {term: "Evals-as-Brakes", definition: "Velocidade de shipping permitida como função da qualidade/cobertura de evals; construir evals em vez de ir mais devagar.", source: "docs/system-of-record.md:303; docs/canonical/evals-as-brakes.md:17"}
  - {term: "Mega-Expert Consolidation", definition: "Um agente por especialidade benchmarkado contra o melhor humano individual, fundidos em um único agente voltado ao cliente, sem handoffs nem deflection bot.", source: "docs/system-of-record.md:305"}
  - {term: "ADR (Architecture Decision Record)", definition: "Documento que registra decisão de arquitetura, contexto e consequências; topo da precedência documental.", source: "curriculum/GLOSSARY.md:61-68; docs/system-of-record.md:16"}
  - {term: "System of Record", definition: "Fonte da verdade: precedência, domínios do projeto, padrões ativos e status de ADRs.", source: "README.md:127; docs/system-of-record.md:12"}
  - {term: "analyze-and-improve", definition: "Pipeline/harness que converte fontes externas em padrões extraídos, classificados e integrados ao repositório.", source: "README.md:136; docs/system-of-record.md:46"}
  - {term: "12-Factor Agents", definition: "Talk de origem (Dex Horthy, AI Engineer 2025) de vários padrões canônicos (error-context-hygiene = Padrão 6, deterministic-tool-dispatch = Padrão 2, etc.).", source: "README.md:67; docs/system-of-record.md:174-177"}
  - {term: "Skill-Canons Bridge", definition: "Framework de 3 níveis de bridging que conecta skills do ecossistema aos padrões canônicos do vault.", source: "docs/decisions/2026-06-24-skill-canons-bridge-implementation.md:27-31"}
  - {term: "verification_depth", definition: "Campo por fase em harness/test-results.json (valores structural|semantic) que registra a profundidade da avaliação do orquestrador; PASS puramente estrutural não é mais suficiente — a verificação semântica é proporcional ao risco do artefato. Ausência do campo = structural (retrocompatível). [NOVO 2026-08-31, commit f19cb1d]", source: ".opencode/skills/harness-analyze-and-improve/SKILL.md:214-219; .opencode/skills/analyze-and-improve/harness/templates/test-results.json:14"}
  - {term: "No fabricated premises (regra de delegação)", definition: "Prompt de delegação nunca afirma convenções do repo (idioma, estilo, formato, contagens, inventário) como fato; o sub-agente detecta a convenção dominante lendo 2-3 artefatos irmãos do diretório alvo e reporta a detecção; conflito entre instrução do operador e convenção detectada → o sub-agente para e reporta antes de escrever. [NOVO 2026-08-31, commit f19cb1d]", source: ".opencode/skills/analyze-and-improve/SKILL.md:130-138, :1125"}

