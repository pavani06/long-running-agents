goals:
  - "Base de conhecimento e currículo para agentes long-running confiáveis: sistemas de IA que operam por horas ou dias sem perder contexto, planejamento ou julgamento de qualidade (README.md:12)."
  - "Ensinar e operacionalizar harness engineering: degradação de agentes longos é lacuna de engenharia, não limitação de modelo; harness é a infraestrutura de suporte ao redor do modelo (README.md:16-18)."
  - "Atacar três falhas estruturais: perda de contexto, planejamento frágil, autoavaliação cega (README.md:24-30)."
  - "Entregar currículo de 12 semanas como produto principal: 4 níveis, 8 conceitos core, 35+ diagramas, ancorado no caso real KODA — agente de venda de suplementos via WhatsApp, conversas de 2+ horas (curriculum/README.md:13; docs/system-of-record.md:71-72)."
  - "Rodar pipeline automatizado de análise de conhecimento externo: harness analyze-and-improve em 7 fases com evaluators e gates, convertendo fontes externas em canonical docs, skills e exercícios (README.md:102, :136)."
  - "Servir de template de sistema de agentes reutilizável: .opencode/ com Handoff Protocol, skills e agentes adaptáveis a outros projetos (README.md:140)."
  - "Governar documentação por precedência: ADRs > canonical > evidence > analysis > archive > READMEs via system of record (docs/system-of-record.md:14-21)."
  - "Disciplina operacional de agentes: uma tarefa por sessão, não assumir, mudança mínima, sucesso verificável, issues/branches traceáveis, gates reais (AGENTS.md:14-16, :26-32, :42-48, :69-78)."
  - "Audiência: pessoas de negócio com skill em construção de agentes, de iniciantes a operadores de produção (README.md:34)."

architecture:
  abstractions:
    - name: "System of Record"
      role: "Mapa das fontes canônicas; resolve conflitos por precedência; define os 6 domínios do projeto"
      evidence: "docs/system-of-record.md:12, :14-21, :23"
    - name: "Biblioteca de padrões canônicos"
      role: "Camada autoritativa de padrões agentic ativos; 154 arquivos .md em docs/canonical/ (inclui cluster Kavak e pacote GTM de 2026-08-30 — 12 docs novos via commit 5292e11); cada padrão documenta problema/mecanismo/trade-offs. [UPDATE 2026-08-31: base declarava 142; o próprio run GTM adicionou 12 docs após o snapshot da Phase 0]"
      evidence: "docs/system-of-record.md:171; directory listing 2026-08-31 (154 .md); commit 5292e11"
    - name: "Currículo"
      role: "Produto principal: 12 semanas, 4 níveis, 8 conceitos core, master docs e diretórios 01-10"
      evidence: "docs/system-of-record.md:71-97"
    - name: "Sistema de agentes .opencode/ (HoP)"
      role: "Modelo HoP (House of Pace) / Handoff Protocol: escopo fechado, dono e gates de validação por agente"
      evidence: "docs/system-of-record.md:27; AGENTS.md:9"
    - name: "Agentes HoP (3)"
      role: "hop-orchestrator-rezek (orquestrador primário negócio→produto→técnica→GTM), koda-hop-init-basic (inicialização guiada KODA), hop-live-whatsapp-tester (testes live WhatsApp com OTP/token e regressão)"
      evidence: "README.md:103; .opencode/agents/hop-orchestrator-rezek.md:21-39; .opencode/agents/koda-hop-init-basic.md:16-26; .opencode/agents/hop-live-whatsapp-tester.md:20, :35-59"
    - name: "Camada de skills"
      role: "35 diretórios em .opencode/skills/: issue lifecycle, orquestração, docs, planos, error hygiene, shadow review, token budget, constraint gates, intent decomposition, analyze-and-improve, mega-expert-consolidation, sidekick-pattern-physical-boundaries, agent-value-maturity-ladder, trial-retention-attribution-split, etc. [UPDATE 2026-08-31: base declarava 33; o pacote GTM (commit 5292e11) adicionou agent-value-maturity-ladder e trial-retention-attribution-split]"
      evidence: "docs/system-of-record.md:66-67; directory listing 2026-08-31 (35); commit 5292e11"
    - name: "Pipeline de análise (analyze-and-improve)"
      role: "Conhecimento → mental model → extração → padrões → classificação → integração; 8 módulos stdlib com cache, retry, model tiering, schemas, chunking, trajectory, eval, refinement. [UPDATE 2026-08-31, commit f19cb1d] Phase 0 opera em modo full ou incremental (Passos 0-pre/0a/0b/0c, cache datado em mapa-mental-repo/) e as delegações seguem a regra no-fabricated-premises: o prompt nunca afirma convenções do repo como fato — o sub-agente detecta a convenção dominante lendo 2-3 artefatos irmãos e reporta; conflito com instrução do operador → para e reporta antes de escrever"
      evidence: "docs/system-of-record.md:46; README.md:102; .opencode/skills/analyze-and-improve/SKILL.md:21, :130-138"
    - name: "Runtime do harness"
      role: "harness/ com GUIDE-analyze-and-improve.md, harness-analysis.sh, templates/, test-results.json. [UPDATE 2026-08-31, commit f19cb1d] O gate de avaliação (Step 6 do orquestrador) passou de estrutural para estrutural + semântico proporcional ao risco do artefato: citation sampling (3 citações file:line conferidas; qualquer erro = NEEDS_WORK), executable content (blocos de código compilados via python3+compile antes de PASS), source fidelity (Phase 1: 3 claims conferidas contra a fonte); a profundidade é registrada por fase como verification_depth: structural|semantic (ausência = structural, retrocompatível)"
      evidence: "harness/ directory listing 2026-08-30; .opencode/skills/harness-analyze-and-improve/SKILL.md:206-219; .opencode/skills/analyze-and-improve/harness/templates/test-results.json:14"
    - name: "Domínio aplicado KODA"
      role: "Product discovery, order processing, fulfillment, journeys, rubrics; conversas de 2+ horas via WhatsApp"
      evidence: "curriculum/README.md:34; README.md:20"
    - name: "Stack e tooling"
      role: "Node >= 20.18.0 ESM, ESLint 10 + 2 regras customizadas, OpenCode, Obsidian (wikilinks/dataview), CLI obsidian-eval, portais HTML estáticos com Mermaid"
      evidence: "README.md:153-161; docs/system-of-record.md:113-128"
    - name: "Estado de runtime"
      role: ".runtime/ e artifacts/ guardam estado de execução; modificação casual proibida (Rule 15)"
      evidence: "AGENTS.md:11, :132-134"
    - name: "Governança GitHub"
      role: "PR template com checklist de crossroad files, CODEOWNERS, issue templates, dependabot, script de issues do currículo"
      evidence: "docs/system-of-record.md:130-142"
    - name: "Mapas mentais de fontes"
      role: "mapa-mental-repo/ guarda mental models dos pipelines (5 ativos em 2026-08-30, incluindo kavak)"
      evidence: "mapa-mental-repo/ directory listing 2026-08-30"
