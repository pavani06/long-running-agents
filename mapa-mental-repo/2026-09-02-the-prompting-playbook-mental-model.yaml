terminology:
  - term: "Agent"
    definition: "Entidade autônoma de IA (geralmente LLM) que pode tomar ações, usar ferramentas e executar tarefas em sequência."
    source: "curriculum/GLOSSARY.md:17-18"
  - term: "Agent Loop"
    definition: "Ciclo repetitivo: recebe input → pensa → toma ação → recebe resultado → repete."
    source: "curriculum/GLOSSARY.md:65-66"
  - term: "Harness"
    definition: "Infraestrutura e padrões que envolvem agentes para fazê-los mais confiáveis por períodos longos (state persistence, planning, evaluation loops, coordenação)."
    source: "curriculum/GLOSSARY.md:457-464"
  - term: "Harness Evolution"
    definition: "Processo de simplificar/remover componentes de harness conforme o modelo melhora."
    source: "curriculum/GLOSSARY.md:474-475"
  - term: "Context Window"
    definition: "Número total de tokens que um modelo pode processar por vez; a memória imediata do agente."
    source: "curriculum/GLOSSARY.md:197-198"
  - term: "Context Amnesia"
    definition: "Agente esquece contexto anterior por ter excedido a janela de contexto."
    source: "curriculum/GLOSSARY.md:74-75"
  - term: "Compaction"
    definition: "Resumir ou comprimir contexto antigo para abrir espaço, mantendo informações-chave; server-side quando feito pelo servidor/modelo."
    source: "curriculum/GLOSSARY.md:120-123"
  - term: "Token Budget / Token Accounting"
    definition: "Gerenciamento consciente de quantos tokens se usa e tem disponível."
    source: "curriculum/GLOSSARY.md:898-899"
  - term: "Generator/Evaluator Pattern"
    definition: "Duas entidades (LLMs) separadas colaboram: uma gera, outra avalia; elimina sycophancy na autoavaliação."
    source: "curriculum/GLOSSARY.md:420-426"
  - term: "Evaluator"
    definition: "Agente separado responsável por avaliar e gravar o trabalho de um Generator, contra rubrics definidas."
    source: "curriculum/GLOSSARY.md:294-295"
  - term: "Sprint Contract"
    definition: "Acordo negociado entre generator e evaluator sobre o que 'pronto' significa antes de começar."
    source: "curriculum/GLOSSARY.md:230-231"
  - term: "Multi-Agent System"
    definition: "Sistema com múltiplos agentes independentes que coordenam entre si; padrão comum Planner + Generator + Evaluator."
    source: "curriculum/GLOSSARY.md:599-601"
  - term: "Trace"
    definition: "Log detalhado de cada passo que um agente toma (input, reasoning, ações, output)."
    source: "curriculum/GLOSSARY.md:945-946"
  - term: "Sycophancy"
    definition: "Tendência de LLMs em agradar o usuário, mesmo aprovando qualidade inferior; solução: separar Generator + Evaluator."
    source: "curriculum/GLOSSARY.md:869-877"
  - term: "KODA"
    definition: "Agente conversacional de IA para venda de suplementos esportivos via WhatsApp (descoberta, pedidos, fulfillment, same-day); case study do programa."
    source: "curriculum/GLOSSARY.md:544-553"
  - term: "METR"
    definition: "Model Evaluation Task Completion Rate: percentual de tarefas completadas com sucesso; benchmark de duração com 50% de sucesso."
    source: "curriculum/GLOSSARY.md:561-566"
  - term: "HoP (House of Pace)"
    definition: "Modelo de orquestração dos agentes do repositório; cada agente tem escopo fechado, dono e gates de validação."
    source: "docs/system-of-record.md:27, .opencode/agents/hop-orchestrator-rezek.md:21"
  - term: "Agent as Declarative File"
    definition: "Agente definido como arquivo markdown/YAML escaneado pelo runtime, com events (aceita/retorna, com schema) e schedule (cron) como campos do formato."
    source: "curriculum/GLOSSARY.md:28-33"
  - term: "Agent Kernel Runtime"
    definition: "Runtime que sustenta a frota como kernel de SO: agendamento, isolamento e journaling; o agente é processo de primeira classe."
    source: "curriculum/GLOSSARY.md:54-57"
  - term: "Typed Event Boundary"
    definition: "Contrato de schema validado em runtime nas duas fronteiras do agente com o mundo externo; a fronteira rejeita, não corrige."
    source: "curriculum/GLOSSARY.md:980-981"
  - term: "Closed-Loop Company"
    definition: "Modelo operacional em que agentes leem estado real da empresa e devolvem próximos trabalhos, bugs e atualizações de decisão."
    source: "curriculum/GLOSSARY.md:113-114"
  - term: "Context Health Monitoring"
    definition: "Extensão do token health monitoring para qualidade: effective context size, near-miss rate, contradiction rate, health score contínuo."
    source: "curriculum/GLOSSARY.md:210-213"
  - term: "Bulk In-Context Trace Analysis"
    definition: "~10k traces de produção submetidos in-context a um frontier model para trend-finding; findings viram casos de eval."
    source: "curriculum/GLOSSARY.md:98-101"

curriculum:
  levels:
    - name: "Nível 1 — Fundamentos"
      focus: "Por que agentes falham em tarefas longas; context windows; token budgeting; harness patterns básicos."
      workload: "3-4h; semanas 1-2."
      sources: ["curriculum/README.md:212-220", "curriculum/README.md:297-298"]
    - name: "Nível 2 — Padrões Práticos"
      focus: "Generator/Evaluator, Sprint Contracts, Rubric Design, Trace Reading."
      workload: "6-8h; semanas 3-4."
      sources: ["curriculum/README.md:226-237", "curriculum/README.md:299-300"]
    - name: "Nível 3 — Arquitetura Avançada"
      focus: "Multi-agent systems, state persistence, file-based coordination, server-side compaction, harness evolution."
      workload: "8-10h; semanas 5-6 (subconjunto)."
      sources: ["curriculum/README.md:241-253", "curriculum/README.md:301-302"]
    - name: "Nível 4 — Aplicação KODA"
      focus: "Arquitetura KODA, customer journeys, feature patterns, rubrics, harness improvements, real-world exercises, case studies."
      workload: "Contínuo; semanas 7-12."
      sources: ["curriculum/README.md:256-267", "curriculum/README.md:303-304"]
    - name: "Níveis auxiliares (apenas exercícios)"
      focus: "03-nivel-3-operational (shadow review, severity calibration), 03-nivel-arquiteto (owner-of-no-role), 04-nivel-3-engenharia-avancada (behavioral eval path analysis)."
      workload: "Exercícios avulsos ancorados em padrões canônicos."
      sources: ["curriculum/MASTER_PLAN.md:109-120", "docs/system-of-record.md:99"]
  concepts:
    - name: "Context Management"
      source: "curriculum/README.md:281, curriculum/05-core-concepts/01-context-management.md"
    - name: "Planning vs. Execution"
      source: "curriculum/README.md:282, curriculum/05-core-concepts/02-planning-execution-separation.md"
    - name: "Generator/Evaluator"
      source: "curriculum/README.md:283, curriculum/05-core-concepts/03-generator-evaluator-pattern.md"
    - name: "Sprint Contracts"
      source: "curriculum/README.md:284, curriculum/05-core-concepts/04-sprint-contracts.md"
    - name: "State Persistence"
      source: "curriculum/README.md:285, curriculum/05-core-concepts/05-state-persistence.md"
    - name: "Harness Evolution"
      source: "curriculum/README.md:286, curriculum/05-core-concepts/06-harness-evolution.md"
    - name: "Multi-Agent Coordination"
      source: "curriculum/README.md:287, curriculum/05-core-concepts/07-multi-agent-coordination.md"
    - name: "Evaluation Rubrics"
      source: "curriculum/README.md:288, curriculum/05-core-concepts/08-evaluation-rubrics.md"
    - name: "Knowledge Graphs (35+ diagramas Mermaid)"
      source: "docs/system-of-record.md:100, curriculum/06-knowledge-graphs/01-concept-ecosystem.md"
    - name: "Case Studies (retro-game-maker, browser-daw, 3× KODA)"
      source: "docs/system-of-record.md:103, curriculum/09-case-studies/"

