meta:
  title: "Mental Model: The Prompting Playbook"
  date: "2026-09-02"
  repo: "long-running-agents"
  type: "mental-model"
  base_commit: "2b56b98"

goals:
  - "Ser base de conhecimento e programa curricular para sistemas de IA que operam de forma confiável por horas ou dias, sem perder contexto, planejamento ou julgamento de qualidade. Sources: README.md:12."
  - "Atacar as três falhas estruturais de agentes long-running (perda de contexto, planejamento frágil, autoavaliação cega) via harness engineering — infraestrutura de suporte ao redor do modelo, não prompts melhores ou modelos maiores. Sources: README.md:24, README.md:26, README.md:28, README.md:30."
  - "Entregar o produto principal: currículo de 12 semanas, 4 níveis, 8 conceitos core e 35+ diagramas, ancorado no caso real KODA (agente de venda de suplementos via WhatsApp). Sources: curriculum/README.md:13, curriculum/README.md:34, docs/system-of-record.md:83."
  - "Manter biblioteca canônica de padrões de arquitetura agentica — 185 padrões ativos segundo o system of record, cada um com problema, mecanismo e trade-offs. Sources: docs/system-of-record.md:181, README.md:67."
  - "Operar como sistema: pipeline analyze-and-improve de 7 fases em harness/, 3 agentes em .opencode/agents/, 36 skills em .opencode/skills/ e dashboards Obsidian. Sources: README.md:102, README.md:103, README.md:104, .opencode/skills/analyze-and-improve/SKILL.md:49."
  - "Servir pessoas de negócio com skill em construção de agentes, de iniciantes a operadores de produção. Sources: README.md:34."
  - "Manter governança documental estrita com precedência ADRs > canonical > evidence > analysis > archive > READMEs, resolvida pelo system of record. Sources: docs/system-of-record.md:14-21, AGENTS.md:82-91."

architecture:
  abstractions:
    - name: "System of record"
      role: "Fonte da verdade: resolve conflitos documentais via cadeia de precedência e mapeia os domínios do projeto."
      sources: ["docs/system-of-record.md:12", "docs/system-of-record.md:14-21"]
    - name: "Domínios do projeto"
      role: "Seis domínios com tabelas de fontes autoritativas: Agentes e orquestração, Currículo e conteúdo, Portal web, Stack e tooling, Governança de repositório, Testes e QA."
      sources: ["docs/system-of-record.md:23-29", "docs/system-of-record.md:83", "docs/system-of-record.md:110", "docs/system-of-record.md:123", "docs/system-of-record.md:141", "docs/system-of-record.md:155"]
    - name: "Biblioteca canônica de padrões"
      role: "docs/canonical/ com 185 padrões ativos (186 arquivos .md no disco): context engineering, evals, harness design, multi-agent coordination, token economics, orquestração por eventos, governança."
      sources: ["docs/system-of-record.md:179-181", "docs/system-of-record.md:183-368"]
    - name: "Currículo"
      role: "Produto principal: 12 semanas, 4 níveis, 8 conceitos core, knowledge graphs, guias, templates, case studies, referências."
      sources: ["docs/system-of-record.md:83", "docs/system-of-record.md:87-104", "curriculum/README.md:13"]
    - name: "Sistema de agentes .opencode"
      role: "Modelo HoP (Handoff Protocol): 3 agentes com escopo fechado e gates — Rezek (orquestrador primário), KODA Init Basic (subagente de inicialização guiada, sem write/edit/bash), Live WhatsApp Tester (subagente de testes live)."
      sources: ["docs/system-of-record.md:27", ".opencode/agents/hop-orchestrator-rezek.md:21", ".opencode/agents/koda-hop-init-basic.md:16", ".opencode/agents/koda-hop-init-basic.md:2-8", ".opencode/agents/hop-live-whatsapp-tester.md:16-20"]
    - name: "Skills (36)"
      role: "Workflows executáveis: lifecycle de issues, orquestração, documentação, planos, error hygiene, shadow review, token budget, constraint gates, intent decomposition, implementação de padrões canônicos."
      sources: [".opencode/skills/ (36 diretórios com SKILL.md)", "README.md:104", "docs/system-of-record.md:36-68"]
    - name: "Harness analyze-and-improve"
      role: "Pipeline de 7 fases (mental model, extração, padrões, classificação, melhorias, integração, integração curricular) com cache, retry, model tiering, schemas, chunking, trajectory, eval e refinement; executável via skill harness ou bash harness."
      sources: [".opencode/skills/analyze-and-improve/SKILL.md:49-57", ".opencode/skills/analyze-and-improve/SKILL.md:92-103", "docs/system-of-record.md:46"]
    - name: "Domínio caso KODA"
      role: "Caso real aplicado: venda de suplementos via WhatsApp (descoberta, pedidos, fulfillment, same-day); conversas de 2+ horas como constraint de confiabilidade."
      sources: ["curriculum/GLOSSARY.md:544-553", "curriculum/README.md:34"]
    - name: "ADRs"
      role: "Decisões arquiteturais aceitas: Skill-Canons Bridge (5 decisões cross-cutting de bridging skills↔canons) e Vault Federation (registro consultável multi-vault + roteamento por domínio)."
      sources: ["docs/system-of-record.md:169-171", "docs/decisions/2026-06-24-skill-canons-bridge-implementation.md:35-42", "docs/decisions/2026-09-01-vault-federation-consultable-registry.md:35-41"]
    - name: "Gestão de conhecimento Obsidian"
      role: "Wikilinks [[path|display]] obrigatórios, frontmatter com type/tags/aliases/relates-to, tags derivadas dos domínios do SOR, slugs lowercase, validação por scripts/validate-obsidian.ts (relates-to é hard error em CI)."
      sources: ["AGENTS.md:136-257", "README.md:158", "README.md:161"]
    - name: "Stack e tooling"
      role: "Node >= 20.18.0 ESM, ESLint 10 + plugin-n + unicorn + 2 regras customizadas, scripts npm lint/test:unit/test:integration/validate:obsidian, OpenCode + MCP context7, obsidian-eval para navegação entre vaults."
      sources: ["package.json:5-14", "README.md:155-161", "docs/system-of-record.md:127-135"]
  relationships:
    - from: "AGENTS.md"
      to: "System of record"
      relationship: "AGENTS.md governa comportamento operacional (17 regras); o SOR governa autoridade documental; a Rule 8 delega resolução de conflito ao SOR."
      sources: ["AGENTS.md:14-130", "docs/system-of-record.md:12-21"]
    - from: "System of record"
      to: "Domínios e fontes"
      relationship: "Cada domínio aponta para suas fontes autoritativas: agentes, skills e canônicos de eventos em 'Agentes e orquestração'; master documents e pastas numeradas em 'Currículo e conteúdo'."
      sources: ["docs/system-of-record.md:31-79", "docs/system-of-record.md:85-106"]
    - from: "Currículo"
      to: "KODA"
      relationship: "Progressão do genérico ao específico: níveis 1-3 ensinam confiabilidade geral; nível 4 aplica as mesmas abstrações à arquitetura KODA, journeys, feature patterns e rubrics."
      sources: ["curriculum/README.md:212-267"]
    - from: "Pipeline analyze-and-improve"
      to: "Canonical docs, skills e currículo"
      relationship: "Fonte externa → artefatos de análise em docs/analysis/<date>-<slug>/ → artefatos definitivos (canonical, skills, exercícios) → integração no SOR e índices; Phase 0 (mental model, só repositório) roda em paralelo com Phase 1 (fonte externa)."
      sources: [".opencode/skills/analyze-and-improve/SKILL.md:105", ".opencode/skills/analyze-and-improve/SKILL.md:140-158"]
    - from: "Cluster de context canônicos"
      to: "Continuidade de sessão longa"
      relationship: "Stable prompt, head-tail truncation, durable facts, summary buffer, topic bucketing, hybrid stack, addressable memory, tiered storage, deliberate forgetting, smallest sufficient context."
      sources: ["docs/system-of-record.md:197-209", "docs/system-of-record.md:279-284"]
    - from: "Cluster de eval canônicos"
      to: "Confiabilidade em produção"
      relationship: "Pain-signal gate → spot-checks → production sampling → tier stratification → PR-gated enforcement → regression flywheel → correlation tracking; consolidado na 3-layer evaluation architecture e no living eval dataset."
      sources: ["docs/system-of-record.md:210-217", "docs/system-of-record.md:298", "docs/system-of-record.md:300"]
    - from: "Skills de issue lifecycle"
      to: "Execução do repositório"
      relationship: "Implementam o mindset de harness para o próprio repo: claim → worktree → implement → review → merge → cleanup com label agent:working, formalizado no canonical agent-lifecycle."
      sources: ["docs/system-of-record.md:78", "AGENTS.md:52-58"]
    - from: "ADRs"
      to: "Ecossistema externo"
      relationship: "Skill-Canons Bridge conecta skills do ecossistema global aos padrões do vault; Vault Federation registra 7 vaults Obsidian como wikillm consultável com roteamento por domínio no skill consumidor."
      sources: ["docs/decisions/2026-06-24-skill-canons-bridge-implementation.md:27-31", "docs/decisions/2026-09-01-vault-federation-consultable-registry.md:25-41"]

